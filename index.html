<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2937">
<title>Asistencia en Obra</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<script>
// Se aplica el tema guardado ANTES de pintar, para que no se vea el destello
// blanco al abrir la app en modo oscuro.
(function () {
  try {
    var t = localStorage.getItem("ao_theme");
    if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
    var dark = t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
    document.querySelector('meta[name="theme-color"]').content = dark ? "#0d0d0f" : "#ffffff";
  } catch (e) {}
})();
</script>
<style>
/* ===========================================================================
   Estilo minimalista, con tema claro y oscuro.

   Una sola tinta de gris para las lineas y la "tinta" (--ink) para todo lo que
   se toca. Sin sombras ni rellenos decorativos: la jerarquia la dan el espacio
   y el peso tipografico. El COLOR queda reservado para el estado de la marca
   (presente / medio dia / falta), que es lo unico que hay que leer de un
   vistazo y a pleno sol.

   Temas: los tokens de abajo son el tema CLARO. El oscuro se aplica solo si el
   sistema lo pide (y el usuario no forzo "claro"), o si el usuario lo eligio a
   mano (atributo data-theme en <html>). Por eso el bloque oscuro aparece dos
   veces: no hay forma en CSS puro de compartirlo entre las dos condiciones.

   Mobile-first: nada baja de 44px de alto tactil.
   =========================================================================== */
*, *::before, *::after { box-sizing:border-box; }

:root {
  --bg:#f7f7f8;              /* fondo de la app */
  --card:#fff;
  --soft:#fafafa;            /* relleno sutil (hover, barras) */
  --ink:#18181b;             /* texto principal y acciones */
  --on-ink:#fff;             /* lo que va ENCIMA de --ink */
  --muted:#71717a;
  --faint:#a1a1aa;
  --line:#e8e8eb;            /* hairline: separadores y bordes de tarjeta */
  --line-2:#d6d6db;          /* borde de control (algo mas marcado) */
  --glass:rgba(255,255,255,.86);
  --veil:rgba(24,24,27,.32); /* fondo del modal */
  --shadow:0 12px 32px rgba(24,24,27,.16);

  --ok:#15803d;   --ok-bg:#f1faf3;   --ok-line:#9ccbaf;
  --half:#a16207; --half-bg:#fdf9ed; --half-line:#dcc588;
  --bad:#b91c1c;  --bad-bg:#fdf2f2;  --bad-line:#e6adad;

  --r:10px; --r-sm:8px;
  color-scheme:light;
}

/* Tema oscuro automatico (el sistema lo pide y el usuario no forzo claro). */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#0d0d0f; --card:#171719; --soft:#1f1f23;
    --ink:#f4f4f5; --on-ink:#0d0d0f; --muted:#a1a1aa; --faint:#6f6f78;
    --line:#26262a; --line-2:#3a3a41;
    --glass:rgba(13,13,15,.86); --veil:rgba(0,0,0,.6);
    --shadow:0 12px 32px rgba(0,0,0,.5);
    --ok:#4ade80;   --ok-bg:#122318;   --ok-line:#2c5f3d;
    --half:#fbbf24; --half-bg:#251d0f; --half-line:#6b521c;
    --bad:#f87171;  --bad-bg:#271515;  --bad-line:#6e3434;
    color-scheme:dark;
  }
}
/* Tema oscuro elegido a mano (gana sobre la preferencia del sistema). */
:root[data-theme="dark"] {
  --bg:#0d0d0f; --card:#171719; --soft:#1f1f23;
  --ink:#f4f4f5; --on-ink:#0d0d0f; --muted:#a1a1aa; --faint:#6f6f78;
  --line:#26262a; --line-2:#3a3a41;
  --glass:rgba(13,13,15,.86); --veil:rgba(0,0,0,.6);
  --shadow:0 12px 32px rgba(0,0,0,.5);
  --ok:#4ade80;   --ok-bg:#122318;   --ok-line:#2c5f3d;
  --half:#fbbf24; --half-bg:#251d0f; --half-line:#6b521c;
  --bad:#f87171;  --bad-bg:#271515;  --bad-line:#6e3434;
  color-scheme:dark;
}

html, body { margin:0; padding:0; }
body {
  background:var(--bg); color:var(--ink);
  font:15.5px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
  letter-spacing:-0.004em;
  -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;
  padding-bottom:calc(70px + env(safe-area-inset-bottom));
  overflow-x:hidden;                 /* nada debe desbordar a lo ancho en el celular */
  overscroll-behavior-y:contain;     /* sin "rebote" que arrastre la pagina de atras */
}
body.no-nav { padding-bottom:0; }
button, input, select, textarea { font:inherit; color:inherit; letter-spacing:inherit; }
button {
  cursor:pointer;
  touch-action:manipulation;              /* sin el retardo de 300ms ni zoom por doble toque */
  -webkit-tap-highlight-color:transparent;
}
/* Los controles que se tocan mucho no deben seleccionarse al mantener pulsado. */
.mark, .reason, .chip, nav.bottom button, .daybar .nav, .seg button { -webkit-user-select:none; user-select:none; }
:focus-visible { outline:2px solid var(--ink); outline-offset:2px; border-radius:4px; }
a { color:var(--ink); }
.hidden { display:none !important; }
svg.i { width:1em; height:1em; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; flex:none; }

/* ------------------------------------------------------------------ layout */
.wrap { max-width:640px; margin:0 auto; padding:0 16px; }

header.top {
  position:sticky; top:0; z-index:20;
  background:var(--glass); backdrop-filter:saturate(1.6) blur(10px);
  border-bottom:1px solid var(--line);
  padding:calc(11px + env(safe-area-inset-top)) 16px 11px;
}
header.top .bar { max-width:640px; margin:0 auto; display:flex; align-items:center; gap:12px; }
header.top .site { flex:1; min-width:0; }
header.top .site .lbl {
  display:block; font-size:10px; font-weight:600; text-transform:uppercase;
  letter-spacing:.1em; color:var(--faint); margin-bottom:1px;
}
header.top .site .val {
  display:flex; align-items:center; gap:5px; font-weight:600; font-size:16.5px;
  letter-spacing:-.015em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
header.top .site .val svg { color:var(--faint); width:13px; height:13px; }
header.top button.ghost {
  background:none; border:1px solid var(--line-2); color:var(--ink); border-radius:999px;
  padding:7px 12px; font-size:13px; font-weight:500; display:flex; align-items:center; gap:6px;
}
header.top button.ghost svg { width:15px; height:15px; }

h2 { font-size:20px; font-weight:600; letter-spacing:-.02em; margin:22px 0 12px; }
h3 { font-size:11px; font-weight:600; margin:22px 0 8px; color:var(--faint); text-transform:uppercase; letter-spacing:.09em; }

/* ------------------------------------------------------------- componentes */
.card { background:var(--card); border:1px solid var(--line); border-radius:var(--r); overflow:hidden; }
.pad { padding:16px; }
.row { display:flex; align-items:center; gap:10px; }
.grow { flex:1; min-width:0; }
.muted { color:var(--muted); font-size:13px; }
.ellip { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

.btn {
  border:1px solid var(--line-2); background:var(--card); border-radius:var(--r-sm);
  padding:11px 15px; font-weight:500; font-size:15px; min-height:46px;
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  transition:background .12s, border-color .12s, opacity .12s;
}
.btn svg { width:16px; height:16px; }
.btn:hover { background:var(--soft); }
.btn.primary { background:var(--ink); border-color:var(--ink); color:var(--on-ink); font-weight:600; }
.btn.primary:hover { opacity:.88; background:var(--ink); }
.btn.dark { background:var(--ink); border-color:var(--ink); color:var(--on-ink); }
.btn.wide { width:100%; }
.btn.sm { padding:7px 12px; min-height:38px; font-size:13.5px; }
.btn.sm svg { width:14px; height:14px; }
.btn.danger { color:var(--bad); border-color:var(--bad-line); }
.btn.danger:hover { background:var(--bad-bg); }
.btn.solid-danger { background:var(--bad); border-color:var(--bad); color:#fff; font-weight:600; }
.btn[disabled] { opacity:.45; pointer-events:none; }

.field { display:block; margin:0 0 14px; }
.field span { display:block; font-size:12px; font-weight:600; color:var(--muted); margin-bottom:6px; }
.field input, .field select, .field textarea {
  width:100%; padding:11px 13px; border:1px solid var(--line-2); border-radius:var(--r-sm);
  background:var(--card); min-height:46px; font-size:15.5px;
}
.field input:focus, .field select:focus { outline:none; border-color:var(--ink); box-shadow:0 0 0 3px var(--line); }
.field input::placeholder { color:var(--faint); }

.msg { border-radius:var(--r-sm); padding:10px 13px; font-size:13.5px; margin:12px 0; }
.msg.err { background:var(--bad-bg); color:var(--bad); }
.msg.ok  { background:var(--ok-bg); color:var(--ok); }

.empty { text-align:center; color:var(--faint); padding:38px 18px; font-size:13.5px; line-height:1.6; }
.empty svg { width:26px; height:26px; margin-bottom:10px; opacity:.55; }

/* ------------------------------------------------------------ pasar lista */
/* La fecha manda: va sola, grande y sin caja. */
.daybar { display:flex; align-items:center; gap:4px; margin:18px 0 14px; }
.daybar .nav {
  width:44px; height:44px; border-radius:999px; border:0; background:none;
  color:var(--muted); display:flex; align-items:center; justify-content:center;
}
.daybar .nav svg { width:18px; height:18px; }
.daybar .nav:hover { background:var(--card); color:var(--ink); }
.daybar .day {
  flex:1; text-align:center; background:none; border:0; padding:2px;
  min-height:44px; display:flex; flex-direction:column; justify-content:center;
}
/* Solo la inicial en mayuscula: "capitalize" pondria "Jueves, 27 De Agosto". */
.cap::first-letter { text-transform:uppercase; }
.daybar .day b { font-size:16.5px; font-weight:600; letter-spacing:-.015em; }
.daybar .day small { color:var(--faint); font-size:11.5px; }

/* Resumen del dia: texto con un punto de color, no bloques rellenos. */
.chips { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; align-items:center; }
.chip {
  border-radius:999px; padding:5px 11px; font-size:12.5px; font-weight:500;
  background:var(--card); border:1px solid var(--line); color:var(--muted);
  display:inline-flex; align-items:center; gap:6px;
}
.chip.dot::before { content:""; width:6px; height:6px; border-radius:999px; background:var(--faint); }
.chip.ok::before   { background:var(--ok); }
.chip.half::before { background:var(--half); }
.chip.bad::before  { background:var(--bad); }
.chip.ok, .chip.half, .chip.bad { color:var(--ink); }
#rangeChips .chip:hover { border-color:var(--line-2); }
#rangeChips .chip.on { background:var(--ink); border-color:var(--ink); color:var(--on-ink); }

.wk { border-bottom:1px solid var(--line); padding:14px 16px; }
.wk:last-child { border-bottom:0; }
.wk .name { font-weight:500; font-size:15.5px; }
.wk .sub { font-size:12.5px; color:var(--faint); margin-top:1px; }
.marks { display:flex; gap:6px; margin-top:11px; }
.mark {
  flex:1; border:1px solid var(--line-2); background:var(--card); border-radius:var(--r-sm);
  min-height:46px; font-weight:500; font-size:13.5px; display:flex; align-items:center;
  justify-content:center; gap:5px; color:var(--muted);
  transition:background .12s, border-color .12s, color .12s;
}
.mark svg { width:15px; height:15px; }
.mark:hover { background:var(--soft); }
/* Seleccionado: tinte muy suave, borde del color y texto en negrita. */
.mark.on { font-weight:600; }
.mark.on.P { background:var(--ok-bg);   border-color:var(--ok-line);   color:var(--ok); }
.mark.on.M { background:var(--half-bg); border-color:var(--half-line); color:var(--half); }
.mark.on.A { background:var(--bad-bg);  border-color:var(--bad-line);  color:var(--bad); }

.reasons { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
.reason {
  border:1px solid var(--line); background:var(--card); border-radius:999px;
  padding:6px 12px; font-size:12.5px; color:var(--muted);
}
.reason:hover { border-color:var(--line-2); }
.reason.on { background:var(--ink); border-color:var(--ink); color:var(--on-ink); font-weight:500; }

.savebar {
  position:fixed; left:0; right:0; bottom:calc(58px + env(safe-area-inset-bottom)); z-index:15;
  padding:10px 16px; background:var(--glass); backdrop-filter:blur(8px);
  border-top:1px solid var(--line);
}
.savebar .inner { max-width:640px; margin:0 auto; }

/* ---------------------------------------------------------------- reporte */
.tbl { width:100%; border-collapse:collapse; font-size:14.5px; }
.tbl th, .tbl td { padding:12px 8px; border-bottom:1px solid var(--line); text-align:right; }
.tbl th:first-child, .tbl td:first-child { text-align:left; }
.tbl th {
  font-size:10.5px; text-transform:uppercase; letter-spacing:.09em;
  color:var(--faint); font-weight:600; padding-bottom:9px;
}
.tbl td { color:var(--muted); font-variant-numeric:tabular-nums; }
.tbl td:first-child { color:var(--ink); font-weight:500; max-width:200px; }
.tbl tbody tr:last-child td { border-bottom:0; }
.tbl tfoot td { font-weight:600; color:var(--ink); border-bottom:0; border-top:1px solid var(--line-2); }
.tbl td.days { font-weight:600; color:var(--ink); font-size:15px; }
.tbl tr.clickable { cursor:pointer; }
.tbl tr.clickable:hover td { background:var(--soft); }
.scroll-x { overflow-x:auto; -webkit-overflow-scrolling:touch; }

/* -------------------------------------------------------------- bottom nav */
nav.bottom {
  position:fixed; left:0; right:0; bottom:0; z-index:20;
  background:var(--glass); backdrop-filter:saturate(1.6) blur(10px);
  border-top:1px solid var(--line); display:flex; padding-bottom:env(safe-area-inset-bottom);
}
nav.bottom button {
  flex:1; border:0; background:none; padding:9px 2px; color:var(--faint);
  font-size:10.5px; font-weight:500; display:flex; flex-direction:column; align-items:center; gap:4px;
  position:relative; letter-spacing:0;
}
nav.bottom button.on { color:var(--ink); font-weight:600; }
/* Indicador del activo: una linea corta arriba, nada mas. */
nav.bottom button.on::before {
  content:""; position:absolute; top:0; left:50%; transform:translateX(-50%);
  width:26px; height:2px; background:var(--ink); border-radius:0 0 2px 2px;
}
nav.bottom svg { width:21px; height:21px; }

/* -------------------------------------------------------------------- modal */
.modal { position:fixed; inset:0; z-index:40; background:var(--veil); display:flex; align-items:flex-end; }
.modal .sheet {
  background:var(--bg); width:100%; max-height:88vh; overflow-y:auto;
  border-radius:16px 16px 0 0; padding:18px 16px calc(24px + env(safe-area-inset-bottom));
}
@media (min-width:640px) {
  .modal { align-items:center; justify-content:center; padding:20px; }
  .modal .sheet { max-width:480px; border-radius:14px; max-height:86vh; }
}
.sheet h2 { margin-top:4px; }
.list-item {
  display:flex; align-items:center; gap:12px; padding:14px 16px;
  border-bottom:1px solid var(--line); background:var(--card); width:100%; border:0; text-align:left;
  font-size:15px; color:var(--ink);
}
.list-item:hover { background:var(--soft); }
.list-item:last-child { border-bottom:0; }
.list-item > svg:first-child { width:18px; height:18px; color:var(--muted); }
.list-item .chev { width:15px; height:15px; color:var(--faint); }
.badge {
  font-size:10.5px; font-weight:600; padding:2px 8px; border-radius:999px;
  background:var(--soft); border:1px solid var(--line); color:var(--muted);
  text-transform:uppercase; letter-spacing:.05em; white-space:nowrap;
}
.badge.admin { background:var(--ink); border-color:var(--ink); color:var(--on-ink); }
.badge.off { background:var(--bad-bg); border-color:var(--bad-line); color:var(--bad); }

/* Ficha de identidad arriba de Ajustes. */
.me-row { display:flex; align-items:center; gap:13px; padding:16px; background:var(--card); }
.avatar {
  width:44px; height:44px; border-radius:999px; background:var(--ink); color:var(--on-ink);
  display:flex; align-items:center; justify-content:center; font-weight:600; font-size:16px; flex:none;
}

/* Selector segmentado (tema claro / oscuro / automatico). */
.seg { display:flex; gap:4px; padding:4px; background:var(--soft); border-radius:var(--r); }
.seg button {
  flex:1; border:0; background:none; border-radius:var(--r-sm); padding:9px 4px; min-height:44px;
  font-size:12.5px; font-weight:500; color:var(--muted);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
}
.seg button svg { width:17px; height:17px; }
.seg button.on { background:var(--card); color:var(--ink); font-weight:600; border:1px solid var(--line); }

/* ------------------------------------------------- dialogo de confirmacion --
   Reemplaza a confirm()/alert() del navegador: los nativos se ven mal en el
   celular y, sobre todo, CONGELAN la pagina mientras estan abiertos.
   Va por encima del modal normal para poder preguntar desde dentro de una ficha. */
.dlg { z-index:60; align-items:center; justify-content:center; padding:22px; }
.dlg-box {
  background:var(--card); width:100%; max-width:360px; border-radius:14px; padding:22px 20px 18px;
  border:1px solid var(--line); box-shadow:var(--shadow); animation:pop .13s ease-out;
}
@keyframes pop { from { transform:scale(.96); opacity:0; } to { transform:scale(1); opacity:1; } }
.dlg-box h3 {
  margin:0 0 7px; font-size:16.5px; font-weight:600; color:var(--ink);
  text-transform:none; letter-spacing:-.015em;
}
.dlg-box p { margin:0 0 18px; font-size:14px; line-height:1.55; color:var(--muted); }
.dlg-actions { display:flex; gap:8px; }
.dlg-actions .btn { flex:1; }

/* -------------------------------------------------------------------- toast */
.toast {
  position:fixed; left:50%; transform:translateX(-50%);
  bottom:calc(76px + env(safe-area-inset-bottom)); z-index:70;
  max-width:calc(100% - 32px); padding:11px 17px; border-radius:999px;
  font-size:14px; font-weight:500; color:var(--on-ink); background:var(--ink);
  box-shadow:var(--shadow); animation:pop .13s ease-out;
  display:flex; align-items:center; gap:8px;
}
.toast svg { width:16px; height:16px; }
.toast.err { background:var(--bad); color:#fff; }

/* ------------------------------------------------------ pantallas angostas --
   A partir de aqui manda el celular chico (360px y similares): se aprieta el
   espaciado para que los tres botones de marcar sigan entrando en una fila. */
@media (max-width:400px) {
  .wrap { padding:0 12px; }
  header.top { padding-left:12px; padding-right:12px; }
  .wk { padding:13px; }
  .marks { gap:5px; }
  .mark { font-size:12.5px; gap:4px; }
  .mark svg { width:14px; height:14px; }
  .reason { padding:6px 10px; font-size:12px; }
  .chip { padding:5px 9px; font-size:12px; }
  .tbl th, .tbl td { padding:11px 5px; }
  .tbl td:first-child { max-width:42vw; }
  h2 { font-size:19px; }
}
/* Pantallas muy chicas (<=330px): los botones pasan a solo el simbolo. */
@media (max-width:330px) {
  .mark .lbl { display:none; }
  .mark svg { width:17px; height:17px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration:.01ms !important; transition-duration:.01ms !important; }
}
</style>
</head>
<body class="no-nav">

<!-- ===================== LOGIN ===================== -->
<section id="login" class="wrap" style="max-width:400px; padding-top:52px;">
  <div style="text-align:center; margin-bottom:26px;">
    <div id="loginMark" style="display:inline-flex; width:52px; height:52px; align-items:center;
         justify-content:center; border-radius:15px; background:var(--ink); color:var(--on-ink); font-size:27px;"></div>
    <h1 style="font-size:23px; font-weight:600; letter-spacing:-.025em; margin:14px 0 4px;">Asistencia en Obra</h1>
    <p class="muted" style="margin:0;">Control de días trabajados</p>
  </div>
  <form id="loginForm" class="card pad">
    <label class="field"><span>Usuario</span>
      <input id="loginName" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    </label>
    <label class="field"><span>Contraseña</span>
      <input id="loginPw" type="password" autocomplete="current-password" required>
    </label>
    <button class="btn primary wide" type="submit">Entrar</button>
    <div id="loginMsg"></div>
    <p class="muted" style="margin:12px 0 0; text-align:center;">
      Si es la primera vez que se usa el sistema, el usuario que entre queda como administrador.
    </p>
  </form>
</section>

<!-- ===================== APP ===================== -->
<div id="app" class="hidden">
  <header class="top">
    <div class="bar">
      <button class="site" id="siteBtn" style="background:none; border:0; color:inherit; text-align:left; padding:0;">
        <span class="lbl">Obra</span>
        <span class="val"><span id="siteName" class="ellip">—</span><span id="siteChev"></span></span>
      </button>
      <button class="ghost" id="meBtn" aria-label="Cuenta y ajustes"></button>
    </div>
  </header>

  <main class="wrap">
    <!-- ---------------- PASAR LISTA ---------------- -->
    <section id="viewList">
      <div class="daybar">
        <button class="nav" id="dayPrev" aria-label="Día anterior"></button>
        <label class="day" style="position:relative;">
          <b id="dayLabel" class="cap">—</b><small id="dayNote"></small>

      <h2>Días trabajados</h2>

        <label class="field grow" style="margin:0;"><span>Desde</span><input type="date" id="repFrom"></label>
        <label class="field grow" style="margin:0;"><span>Hasta</span><input type="date" id="repTo"></label>

<div id="modalRoot"></div>
<div id="dialogRoot"></div>

<script>
/* ===========================================================================
   Estado y utilidades
   =========================================================================== */
const S = {
  token: localStorage.getItem("ao_token") || "",
  me: JSON.parse(localStorage.getItem("ao_me") || "null"),
  siteId: Number(localStorage.getItem("ao_site")) || null,
  sites: [],
  view: "list",
  day: todayLocal(),
  workers: [],          // trabajadores del dia con su marca
  dirty: new Set(),     // ids con cambios sin guardar
};

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

// Fecha LOCAL en YYYY-MM-DD (nunca toISOString, que corre al dia UTC).
function todayLocal(d = new Date()) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function shiftDay(day, n) {
  const [y, m, d] = day.split("-").map(Number);
  const dt = new Date(y, m - 1, d + n);
  return todayLocal(dt);
}
function prettyDay(day) {
  const [y, m, d] = day.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString("es", { weekday:"long", day:"numeric", month:"long" });
}
function isWeekend(day) {
  const [y, m, d] = day.split("-").map(Number);
  const w = new Date(y, m - 1, d).getDay();
  return w === 0 || w === 6;
}
const fmtDays = (n) => (Number.isInteger(n) ? String(n) : n.toFixed(1));
const plural = (n, uno, varios) => `${n} ${n === 1 ? uno : varios}`;
// Iniciales para el circulo de identidad ("Luis Pérez" -> "LP").
const initials = (name) => (name || "?").trim().split(/\s+/).slice(0, 2).map((p) => p[0]).join("").toUpperCase();
// Estado vacio con icono, para no dejar un texto suelto en medio de la nada.
const emptyState = (ic, html) => `<div class="empty">${icon(ic)}<div>${html}</div></div>`;

/* ===========================================================================
   Iconos y tema
   =========================================================================== */

// Trazos de cada icono (el <svg> lo arma icon()). Todos en una caja de 24x24,
// solo contorno, para que hereden color y grosor del texto que los rodea.
const ICONS = {
  list:      '<rect x="3" y="4.5" width="18" height="16.5" rx="2.5"/><path d="M8 2.5v4M16 2.5v4M3 9.5h18M8.5 14.5l2 2 4-4"/>',
  chart:     '<path d="M4 20V10.5M10 20V4M16 20v-6.5M22 20H2"/>',
  people:    '<circle cx="9" cy="7.5" r="3.3"/><path d="M2.8 20a6.2 6.2 0 0 1 12.4 0M16.5 10.7A3 3 0 0 0 16 4.9M21.2 20a5 5 0 0 0-3.1-4.6"/>',
  settings:  '<circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1v.2a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-2.8-1.1l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.6 1.6 0 0 0 3.5 14h-.2a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 7.2l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.6 1.6 0 0 0 10 3.5v-.2a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 2.8 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.2 1.8"/>',
  building:  '<path d="M3 21h18M5 21V4.5A1.5 1.5 0 0 1 6.5 3h7A1.5 1.5 0 0 1 15 4.5V21M15 10h3.5A1.5 1.5 0 0 1 20 11.5V21M8.5 7h3M8.5 11h3M8.5 15h3"/>',
  helmet:    '<path d="M3.5 17.5a8.5 8.5 0 0 1 17 0"/><path d="M9.5 9.6V4.8A1.8 1.8 0 0 1 11.3 3h1.4a1.8 1.8 0 0 1 1.8 1.8v4.8"/><rect x="2" y="17.5" width="20" height="3.5" rx="1.7"/>',
  check:     '<path d="M4.5 12.5l5 5 10-11"/>',
  half:      '<circle cx="12" cy="12" r="9"/><path d="M12 3v18" /><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor" stroke="none"/>',
  cross:     '<path d="M6 6l12 12M18 6L6 18"/>',
  left:      '<path d="M15 5l-7 7 7 7"/>',
  right:     '<path d="M9 5l7 7-7 7"/>',
  chevron:   '<path d="M9 5l7 7-7 7"/>',
  plus:      '<path d="M12 5v14M5 12h14"/>',
  download:  '<path d="M12 3v12M7.5 10.5L12 15l4.5-4.5M4 20h16"/>',
  sun:       '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>',
  moon:      '<path d="M20.5 14.3A8.5 8.5 0 0 1 9.7 3.5a8.5 8.5 0 1 0 10.8 10.8z"/>',
  auto:      '<rect x="2.5" y="4" width="19" height="13" rx="2"/><path d="M8 21h8M12 17v4"/>',
  key:       '<circle cx="8" cy="14" r="4.2"/><path d="M11 11.5L20 2.5M17 5.5l2.5 2.5M14.5 8l2 2"/>',
  logout:    '<path d="M9.5 21H5.5A1.5 1.5 0 0 1 4 19.5v-15A1.5 1.5 0 0 1 5.5 3h4M16 16.5l4.5-4.5L16 7.5M20 12H9.5"/>',
  userPlus:  '<circle cx="9.5" cy="7.5" r="3.6"/><path d="M3 20a6.5 6.5 0 0 1 13 0M18.5 8v6M21.5 11h-6"/>',
  trash:     '<path d="M4 6.5h16M9.5 6.5V4.2A1.2 1.2 0 0 1 10.7 3h2.6a1.2 1.2 0 0 1 1.2 1.2v2.3M6.5 6.5l.9 13a1.5 1.5 0 0 0 1.5 1.4h6.2a1.5 1.5 0 0 0 1.5-1.4l.9-13"/>',
  edit:      '<path d="M4 20h4l10.5-10.5a2.1 2.1 0 0 0-3-3L5 17v3z"/>',
  info:      '<circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.6v.1"/>',
  calendar:  '<rect x="3" y="4.5" width="18" height="16.5" rx="2.5"/><path d="M8 2.5v4M16 2.5v4M3 9.5h18"/>',
  user:      '<circle cx="12" cy="8" r="3.6"/><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0"/>',
  down:      '<path d="M5 9l7 7 7-7"/>',
  inbox:     '<path d="M3 13h5l1.5 3h5L16 13h5"/><path d="M5.2 4.5h13.6a2 2 0 0 1 1.9 1.4L22 13v5a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-5l1.3-7.1a2 2 0 0 1 1.9-1.4z"/>',
};

// <svg> listo para insertar. `cls` permite ajustar tamaño con una clase extra.
function icon(name, cls = "") {
  return `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name] || ""}</svg>`;
}

/* --------------------------------- tema ---------------------------------- */
// "auto" sigue al sistema; "light"/"dark" lo fuerzan. Se guarda por dispositivo.
const THEMES = [
  ["auto",  "Automático", "auto"],
  ["light", "Claro",      "sun"],
  ["dark",  "Oscuro",     "moon"],
];

function currentTheme() {
  const t = localStorage.getItem("ao_theme");
  return THEMES.some((x) => x[0] === t) ? t : "auto";
}

function applyTheme(t) {
  const pref = THEMES.some((x) => x[0] === t) ? t : "auto";
  localStorage.setItem("ao_theme", pref);
  // "auto" = sin atributo, para que mande la media query prefers-color-scheme.
  if (pref === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", pref);
  // La barra del navegador en el celular tiene que acompañar al tema.
  const dark = pref === "dark" ||
    (pref === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.querySelector('meta[name="theme-color"]').content = dark ? "#0d0d0f" : "#ffffff";
}

/* --------------------------------- API ---------------------------------- */
async function api(path, { method = "GET", body } = {}) {
  const res = await fetch(path, {
    method,
    headers: {
      ...(body ? { "content-type": "application/json" } : {}),
      ...(S.token ? { "x-session-token": S.token } : {}),
    },
    body: body ? JSON.stringify(body) : undefined,
  });
  let data = {};
  try { data = await res.json(); } catch {}
  if (res.status === 401 && S.token) { logout(); throw new Error("Sesión expirada. Vuelve a entrar."); }
  if (!res.ok) throw new Error(data.error || `Error ${res.status}`);
  return data;
}

/* --------------------------- avisos y preguntas -------------------------- */
// Aviso breve que no interrumpe (reemplaza a alert()).
let toastTimer = null;
function toast(text, kind = "ok") {
  document.querySelectorAll(".toast").forEach((t) => t.remove());
  const el = document.createElement("div");
  el.className = `toast ${kind === "err" ? "err" : ""}`;
  el.setAttribute("role", "status");
  el.innerHTML = icon(kind === "err" ? "info" : "check") + `<span>${esc(text)}</span>`;
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), kind === "err" ? 4000 : 2600);
}

// Pregunta de si/no. Reemplaza a confirm(): el nativo se ve mal en el celular y
// congela la pagina entera mientras esta abierto. Devuelve una promesa -> se usa
// con `if (!(await ask({...}))) return;`.
function ask({ title, text = "", ok = "Aceptar", cancel = "Cancelar", danger = false }) {
  return new Promise((resolve) => {
    const root = $("dialogRoot");
    root.innerHTML = `
      <div class="modal dlg" role="dialog" aria-modal="true">
        <div class="dlg-box">
          <h3>${esc(title)}</h3>
          ${text ? `<p>${esc(text)}</p>` : ""}
          <div class="dlg-actions">
            <button class="btn" data-r="0">${esc(cancel)}</button>
            <button class="btn ${danger ? "solid-danger" : "primary"}" data-r="1">${esc(ok)}</button>
          </div>
        </div>
      </div>`;
    const done = (v) => { document.removeEventListener("keydown", onKey); root.innerHTML = ""; resolve(v); };
    const onKey = (e) => {
      if (e.key === "Escape") done(false);
      else if (e.key === "Enter") done(true);
    };
    document.addEventListener("keydown", onKey);
    root.querySelectorAll("[data-r]").forEach((b) =>
      b.addEventListener("click", () => done(b.dataset.r === "1")));
    // Tocar fuera del cuadro = cancelar.
    root.querySelector(".modal").addEventListener("click", (e) => {
      if (e.target.classList.contains("modal")) done(false);
    });
    root.querySelector('[data-r="1"]').focus();
  });
}

/* ===========================================================================
   Login / sesion
   =========================================================================== */
$("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = e.target.querySelector("button");
  btn.disabled = true;
  $("loginMsg").innerHTML = "";
  try {
    const r = await api("/api/auth", {
      method: "POST",
      body: { name: $("loginName").value.trim(), password: $("loginPw").value },
    });
    S.token = r.token; S.me = r.user;
    localStorage.setItem("ao_token", S.token);
    localStorage.setItem("ao_me", JSON.stringify(S.me));
    $("loginPw").value = "";
    await start();
  } catch (err) {
    $("loginMsg").innerHTML = `<div class="msg err">${esc(err.message)}</div>`;
  } finally { btn.disabled = false; }
});

function logout() {
  S.token = ""; S.me = null; S.dirty.clear();
  localStorage.removeItem("ao_token");
  localStorage.removeItem("ao_me");
  $("app").classList.add("hidden");
  $("login").classList.remove("hidden");
  document.body.classList.add("no-nav");
}

/* ===========================================================================
   Arranque
   =========================================================================== */
async function start() {
  $("meBtn").textContent = initials(S.me?.fullName || S.me?.name);
  $("login").classList.add("hidden");
  $("app").classList.remove("hidden");
  document.body.classList.remove("no-nav");
  await loadSites();
  setView(S.view);
}

async function loadSites() {
  const { sites } = await api("/api/sites");
  S.sites = sites;
  if (!sites.length) { S.siteId = null; $("siteName").textContent = "Sin obras"; return; }
  if (!S.siteId || !sites.some((s) => s.id === S.siteId)) S.siteId = sites[0].id;
  localStorage.setItem("ao_site", S.siteId);
  $("siteName").textContent = sites.find((s) => s.id === S.siteId).name;
}

/* ===========================================================================
   Navegacion
   =========================================================================== */
document.querySelectorAll("nav.bottom button").forEach((b) => {
  b.addEventListener("click", () => setView(b.dataset.view));
});

async function setView(v) {
  if (S.dirty.size && v !== "list" && !(await ask({
    title: "Tienes marcas sin guardar",
    text: `${S.dirty.size} ${S.dirty.size === 1 ? "trabajador quedó marcado" : "trabajadores quedaron marcados"} sin guardar. Si sales ahora se pierden.`,
    ok: "Salir sin guardar", cancel: "Seguir aquí", danger: true,
  }))) return;
  S.view = v;
  document.querySelectorAll("nav.bottom button").forEach((b) => b.classList.toggle("on", b.dataset.view === v));
  for (const [name, el] of Object.entries({
    list: $("viewList"), report: $("viewReport"), staff: $("viewStaff"), settings: $("viewSettings"),
  })) el.classList.toggle("hidden", name !== v);
  $("saveBar").classList.toggle("hidden", v !== "list" || !S.dirty.size);
  window.scrollTo(0, 0);

  if (v === "list") loadDay();
  if (v === "report") loadReport();
  if (v === "staff") loadStaff();
  if (v === "settings") renderSettings();
}

/* ===========================================================================
   Vista: pasar lista
   =========================================================================== */
const REASONS = ["Falta", "Permiso", "Licencia", "Lluvia", "Feriado", "Accidente"];
// El medio dia va como "½": ningun icono lo dice tan claro.
const MARK_ICON = { P: icon("check"), M: '<span style="font-size:17px; line-height:1;">&#189;</span>', A: icon("cross") };
const MARK_LABEL = { P: "Presente", M: "Medio", A: "Falta" };

$("dayPrev").addEventListener("click", () => goDay(shiftDay(S.day, -1)));
$("dayNext").addEventListener("click", () => goDay(shiftDay(S.day, 1)));
$("dayInput").addEventListener("change", (e) => { if (e.target.value) goDay(e.target.value); });

async function goDay(day) {
  if (S.dirty.size && !(await ask({
    title: "Tienes marcas sin guardar",
    text: "Si cambias de día se pierden las marcas que no guardaste.",
    ok: "Cambiar igual", cancel: "Seguir aquí", danger: true,
  }))) return;
  S.day = day; S.dirty.clear(); loadDay();
}

async function loadDay() {
  $("dayLabel").textContent = prettyDay(S.day);
  $("dayInput").value = S.day;
  $("dayNote").textContent =
    S.day === todayLocal() ? "hoy" : (isWeekend(S.day) ? "fin de semana" : "");

  if (!S.siteId) {
    $("workerList").innerHTML = emptyState("building", "No hay obras todavía.<br>Créala en <b>Ajustes → Obras</b>.");
    $("summary").innerHTML = "";
    return;
  }
  $("workerList").innerHTML = `<div class="empty">Cargando…</div>`;
  try {
    const r = await api(`/api/attendance?siteId=${S.siteId}&day=${S.day}`);
    S.workers = r.workers;
    S.dirty.clear();
    renderDay();
  } catch (err) {
    $("workerList").innerHTML = `<div class="empty">${esc(err.message)}</div>`;
  }
}

function renderDay() {
  const w = S.workers;
  if (!w.length) {
    $("summary").innerHTML = "";
    $("workerList").innerHTML = emptyState("people", "Esta obra no tiene personal.<br>Agrégalo en <b>Personal</b>.");
    $("saveBar").classList.add("hidden");
    return;
  }
  const n = (st) => w.filter((x) => x.status === st).length;
  const pend = w.length - n("P") - n("M") - n("A");
  const jornadas = n("P") + n("M") * 0.5;
  $("summary").innerHTML =
    `<span class="chip dot ok">${plural(n("P"), "presente", "presentes")}</span>` +
    `<span class="chip dot half">${plural(n("M"), "medio día", "medios días")}</span>` +
    `<span class="chip dot bad">${plural(n("A"), "falta", "faltas")}</span>` +
    (pend ? `<span class="chip dot">${pend} sin marcar</span>` : "") +
    `<span class="chip">${fmtDays(jornadas)} ${jornadas === 1 ? "jornada" : "jornadas"}</span>`;

  $("workerList").innerHTML = w.map((x) => `
    <div class="wk" data-id="${x.id}">
      <div class="row">
        <div class="grow">
          <div class="name ellip">${esc(x.fullName)}</div>
          <div class="sub ellip">${esc(x.trade || "—")}${x.markedByName ? ` · marcó ${esc(x.markedByName)}` : ""}</div>
        </div>
      </div>
      <div class="marks">
        ${["P", "M", "A"].map((st) => `
          <button class="mark ${st} ${x.status === st ? "on" : ""}" data-mark="${st}"
                  aria-pressed="${x.status === st}" aria-label="${MARK_LABEL[st]} — ${esc(x.fullName)}">
            ${MARK_ICON[st]} <span class="lbl">${MARK_LABEL[st]}</span>
          </button>`).join("")}
      </div>
      ${x.status && x.status !== "P" ? `
        <div class="reasons">
          ${REASONS.map((r) => `<button class="reason ${x.reason === r ? "on" : ""}" data-reason="${esc(r)}">${esc(r)}</button>`).join("")}
        </div>` : ""}
    </div>`).join("");

  $("saveBar").classList.toggle("hidden", !S.dirty.size || S.view !== "list");
  $("saveBtn").textContent = S.dirty.size ? `Guardar lista (${S.dirty.size})` : "Guardar lista";
}

// Delegacion: marcar estado y elegir motivo.
$("workerList").addEventListener("click", (e) => {
  const wk = e.target.closest(".wk");
  if (!wk) return;
  const id = Number(wk.dataset.id);
  const w = S.workers.find((x) => x.id === id);
  if (!w) return;

  const markBtn = e.target.closest("[data-mark]");
  if (markBtn) {
    const st = markBtn.dataset.mark;
    w.status = w.status === st ? null : st;   // volver a tocar el mismo estado lo desmarca
    if (w.status === "P" || !w.status) w.reason = null;
    S.dirty.add(id);
    renderDay();
    return;
  }
  const reasonBtn = e.target.closest("[data-reason]");
  if (reasonBtn) {
    const r = reasonBtn.dataset.reason;
    w.reason = w.reason === r ? null : r;
    S.dirty.add(id);
    renderDay();
  }
});

$("allPresent").addEventListener("click", () => {
  S.workers.forEach((w) => { if (!w.status) { w.status = "P"; w.reason = null; S.dirty.add(w.id); } });
  renderDay();
});
$("clearAll").addEventListener("click", async () => {
  if (!(await ask({
    title: "¿Limpiar el día?",
    text: "Se quitan todas las marcas de esta fecha. Recuerda guardar para que el cambio quede registrado.",
    ok: "Limpiar", cancel: "Cancelar", danger: true,
  }))) return;
  S.workers.forEach((w) => { w.status = null; w.reason = null; S.dirty.add(w.id); });
  renderDay();
});

$("saveBtn").addEventListener("click", async () => {
  if (!S.dirty.size) return;
  const btn = $("saveBtn");
  btn.disabled = true; btn.textContent = "Guardando…";
  try {
    const marks = [...S.dirty].map((id) => {
      const w = S.workers.find((x) => x.id === id);
      return { workerId: id, status: w.status || "", reason: w.reason || null };
    });
    await api("/api/attendance", { method: "POST", body: { siteId: S.siteId, day: S.day, marks } });
    S.dirty.clear();
    toast("Lista guardada");
    await loadDay();
  } catch (err) {
    toast(err.message, "err");
  } finally { btn.disabled = false; renderDay(); }
});

/* ===========================================================================
   Vista: reporte
   =========================================================================== */
const RANGES = [
  ["Esta semana", () => weekRange(0)],
  ["Semana pasada", () => weekRange(-1)],
  ["Este mes", () => monthRange(0)],
  ["Mes pasado", () => monthRange(-1)],
];

// Semana de lunes a domingo (offset en semanas respecto de la actual).
function weekRange(off) {
  const d = new Date();
  d.setDate(d.getDate() + off * 7);
  const dow = (d.getDay() + 6) % 7;          // 0 = lunes
  const from = new Date(d); from.setDate(d.getDate() - dow);
  const to = new Date(from); to.setDate(from.getDate() + 6);
  return [todayLocal(from), todayLocal(to)];
}
function monthRange(off) {
  const d = new Date();
  const from = new Date(d.getFullYear(), d.getMonth() + off, 1);
  const to = new Date(d.getFullYear(), d.getMonth() + off + 1, 0);
  return [todayLocal(from), todayLocal(to)];
}

$("rangeChips").innerHTML = RANGES.map((r, i) =>
  `<button class="chip" data-range="${i}">${r[0]}</button>`).join("");
$("rangeChips").addEventListener("click", (e) => {
  const b = e.target.closest("[data-range]");
  if (!b) return;
  const [f, t] = RANGES[Number(b.dataset.range)][1]();
  $("repFrom").value = f; $("repTo").value = t;
  loadReport();
});
// El rango elegido se resalta; si se editan las fechas a mano, ninguno queda activo.
function markActiveRange() {
  const f = $("repFrom").value, t = $("repTo").value;
  $("rangeChips").querySelectorAll("[data-range]").forEach((b) => {
    const [rf, rt] = RANGES[Number(b.dataset.range)][1]();
    b.classList.toggle("on", rf === f && rt === t);
  });
}
$("repFrom").addEventListener("change", loadReport);
$("repTo").addEventListener("change", loadReport);

let lastReport = null;

async function loadReport() {
  if (!$("repFrom").value || !$("repTo").value) {
    const [f, t] = monthRange(0);
    $("repFrom").value = f; $("repTo").value = t;
  }
  if (!S.siteId) { $("reportBox").innerHTML = `<div class="empty">No hay obras todavía.</div>`; return; }
  $("reportBox").innerHTML = `<div class="empty">Cargando…</div>`;
  try {
    const r = await api(`/api/report?siteId=${S.siteId}&from=${$("repFrom").value}&to=${$("repTo").value}`);
    lastReport = r;
    renderReport(r);
    markActiveRange();
  } catch (err) {
    $("reportBox").innerHTML = `<div class="empty">${esc(err.message)}</div>`;
  }
}

function renderReport(r) {
  if (!r.rows.length) { $("reportBox").innerHTML = emptyState("chart", "Sin datos en este período."); return; }
  $("reportBox").innerHTML = `
    <table class="tbl">
      <thead><tr>
        <th>Trabajador</th><th>&#10003;</th><th>&#189;</th><th>&#10007;</th><th>Días</th>
      </tr></thead>
      <tbody>
        ${r.rows.map((x) => `
          <tr class="clickable" data-w="${x.workerId}">
            <td class="ellip">${esc(x.fullName)}${x.active ? "" : ' <span class="badge off">baja</span>'}</td>
            <td>${x.P}</td><td>${x.M}</td><td>${x.A}</td>
            <td class="days">${fmtDays(x.worked)}</td>
          </tr>`).join("")}
      </tbody>
      <tfoot><tr>
        <td>Total (${r.rows.length})</td>
        <td>${r.totals.P}</td><td>${r.totals.M}</td><td>${r.totals.A}</td>
        <td>${fmtDays(r.totals.worked)}</td>
      </tr></tfoot>
    </table>`;
}

// Detalle dia a dia de un trabajador.
$("reportBox").addEventListener("click", (e) => {
  const tr = e.target.closest("[data-w]");
  if (!tr || !lastReport) return;
  const row = lastReport.rows.find((x) => x.workerId === Number(tr.dataset.w));
  if (!row) return;
  const label = { P:'<span class="chip ok">Presente</span>', M:'<span class="chip half">Medio día</span>', A:'<span class="chip bad">Falta</span>' };
  openModal(`
    <h2>${esc(row.fullName)}</h2>
    <p class="muted" style="margin:-6px 0 12px;">${lastReport.from} → ${lastReport.to} · <b>${fmtDays(row.worked)} días</b></p>
    <div class="card">
      ${lastReport.days.map((d) => {
        const st = row.marks[d];
        return `<div class="list-item">
          <div class="grow"><div class="cap">${prettyDay(d)}</div></div>
          ${st ? label[st] : '<span class="muted">sin marcar</span>'}
        </div>`;
      }).join("")}
    </div>`);
});

$("csvBtn").addEventListener("click", () => {
  if (!lastReport || !lastReport.rows.length) return toast("Nada que exportar", "err");
  const site = S.sites.find((s) => s.id === S.siteId)?.name || "obra";
  const q = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const lines = [
    [q("Obra"), q(site)].join(";"),
    [q("Desde"), q(lastReport.from), q("Hasta"), q(lastReport.to)].join(";"),
    "",
    ["Trabajador", "Oficio", "Presentes", "Medio dia", "Faltas", "Dias trabajados"].map(q).join(";"),
    ...lastReport.rows.map((x) =>
      [q(x.fullName), q(x.trade || ""), x.P, x.M, x.A, fmtDays(x.worked)].join(";")),
    [q("TOTAL"), "", lastReport.totals.P, lastReport.totals.M, lastReport.totals.A, fmtDays(lastReport.totals.worked)].join(";"),
  ];
  // BOM para que Excel abra bien los acentos.
  const blob = new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `asistencia_${site.replace(/[^\w]+/g, "-")}_${lastReport.from}_${lastReport.to}.csv`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
});

async function loadStaff() {
  $("addWorker").classList.toggle("hidden", S.me?.role !== "admin");
  if (!S.siteId) { $("staffList").innerHTML = `<div class="empty">No hay obras todavía.</div>`; return; }
  $("staffList").innerHTML = `<div class="empty">Cargando…</div>`;
  try {
    const { workers } = await api(`/api/workers?siteId=${S.siteId}&all=1`);
    if (!workers.length) {
      $("staffList").innerHTML = emptyState("people", "Sin personal en esta obra.");
      return;
    }
    $("staffList").innerHTML = workers.map((w) => `
      <button class="list-item" data-w="${w.id}">
        <div class="grow">
          <div class="ellip"><b>${esc(w.fullName)}</b>${w.active ? "" : ' <span class="badge off">baja</span>'}</div>
          <div class="muted ellip">${esc(w.trade || "—")}${w.docId ? " · " + esc(w.docId) : ""}</div>
        </div>
        ${S.me?.role === "admin" ? icon("chevron", "chev") : ""}
      </button>`).join("");
    $("staffList").querySelectorAll("[data-w]").forEach((b) => {
      b.addEventListener("click", () => {
        if (S.me?.role !== "admin") return;
        workerForm(workers.find((w) => w.id === Number(b.dataset.w)));
      });
    });
  } catch (err) {
    $("staffList").innerHTML = `<div class="empty">${esc(err.message)}</div>`;
  }
}

    </form>
    ${isNew ? "" : `<button class="btn danger wide" id="wDel" style="margin-top:10px;">${icon("trash")}Dar de baja</button>`}
  `);

  $("wForm").addEventListener("submit", async (e) => {

    }))) return;
    try {
      await api(`/api/workers?id=${w.id}`, { method: "DELETE" });
      closeModal(); toast("Trabajador dado de baja"); loadStaff(); loadSites();
    } catch (err) { toast(err.message, "err"); }
  });
}

async function sitesScreen() {
  const admin = S.me?.role === "admin";
  const { sites } = await api("/api/sites" + (admin ? "?all=1" : ""));
  S.sites = sites.filter((s) => s.active);
  openModal(`
    <h2>Obras</h2>
    <div class="card">
      ${sites.length ? sites.map((s) => `
        <button class="list-item" data-s="${s.id}">
          <div class="grow">
            <div class="ellip"><b>${esc(s.name)}</b>${s.active ? "" : ' <span class="badge off">cerrada</span>'}</div>
            <div class="muted ellip">${esc(s.address || "—")} · ${s.workers} trabajador${s.workers === 1 ? "" : "es"}</div>
          </div>
          ${admin ? icon("chevron", "chev") : ""}
        </button>`).join("") : emptyState("building", "Sin obras.")}
    </div>
    ${admin ? `<button class="btn primary wide" id="addSite" style="margin-top:12px;">${icon("plus")}Nueva obra</button>` : ""}
  `);
  $("modalRoot").querySelectorAll("[data-s]").forEach((b) => {
    b.addEventListener("click", () => {
      const s = sites.find((x) => x.id === Number(b.dataset.s));
      admin ? siteForm(s) : pickSite(s);
    });
  });
  if (admin) $("addSite").addEventListener("click", () => siteForm(null));
}

function siteForm(s) {
  const isNew = !s;
  openModal(`
    <h2>${isNew ? "Nueva obra" : "Editar obra"}</h2>
    <form id="sForm" class="card pad">
      <label class="field"><span>Nombre *</span><input id="sName" value="${esc(s?.name || "")}" required maxlength="80" placeholder="Edificio Los Aromos"></label>
      <label class="field"><span>Dirección</span><input id="sAddr" value="${esc(s?.address || "")}" maxlength="160"></label>
      ${isNew ? "" : `
        <label class="row" style="margin-bottom:12px; gap:8px;">
          <input type="checkbox" id="sActive" ${s.active ? "checked" : ""} style="width:20px; height:20px;">
          <span>Obra en curso</span>
        </label>`}
      <div id="sMsg"></div>
      <button class="btn primary wide" type="submit">${isNew ? "Crear" : "Guardar"}</button>
    </form>
    ${isNew || !s.active ? "" : `<button class="btn wide" id="sPick" style="margin-top:10px;">Trabajar en esta obra</button>`}
  `);
  $("sForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const body = { name: $("sName").value, address: $("sAddr").value };
    if (!isNew) body.active = $("sActive").checked;
    try {
      const r = await api(isNew ? "/api/sites" : `/api/sites?id=${s.id}`, { method: isNew ? "POST" : "PUT", body });
      await loadSites();
      if (isNew && r.site) { S.siteId = r.site.id; localStorage.setItem("ao_site", S.siteId); await loadSites(); }
      closeModal(); toast(isNew ? "Obra creada" : "Guardado"); setView(S.view);
    } catch (err) { $("sMsg").innerHTML = `<div class="msg err">${esc(err.message)}</div>`; }
  });
  if (!isNew && s.active) $("sPick").addEventListener("click", () => pickSite(s));
}

function pickSite(s) {
  S.siteId = s.id;
  localStorage.setItem("ao_site", S.siteId);
  $("siteName").textContent = s.name;
  S.dirty.clear();
  closeModal();
  setView("list");
}

$("csvBtn").innerHTML = icon("download") + "Descargar CSV";
// El boton de cuenta muestra las iniciales del usuario (se completa al entrar).
$("meBtn").textContent = "…";

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/sw.js").catch(() => {});
}

(async () => {
  if (!S.token) return;
  try {
    const { me } = await api("/api/auth");
    S.me = me;
    localStorage.setItem("ao_me", JSON.stringify(me));
    await start();
  } catch { logout(); }
})();
</script>
