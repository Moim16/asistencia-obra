<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2937">
<title>Asistencia en Obra</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<script>
// Se aplica el tema guardado ANTES de pintar, para que no se vea el destello
// blanco al abrir la app en modo oscuro.
(function () {
  try {
    var t = localStorage.getItem("ao_theme");
    if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
    var dark = t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
    document.querySelector('meta[name="theme-color"]').content = dark ? "#0d0d0f" : "#ffffff";
  } catch (e) {}
})();
</script>
<style>
/* ===========================================================================
   Estilo minimalista, con tema claro y oscuro.

   Una sola tinta de gris para las lineas y la "tinta" (--ink) para todo lo que
   se toca. Sin sombras ni rellenos decorativos: la jerarquia la dan el espacio
   y el peso tipografico. El COLOR queda reservado para el estado de la marca
   (presente / medio dia / falta), que es lo unico que hay que leer de un
   vistazo y a pleno sol.

   Temas: los tokens de abajo son el tema CLARO. El oscuro se aplica solo si el
   sistema lo pide (y el usuario no forzo "claro"), o si el usuario lo eligio a
   mano (atributo data-theme en <html>). Por eso el bloque oscuro aparece dos
   veces: no hay forma en CSS puro de compartirlo entre las dos condiciones.

   Mobile-first: nada baja de 44px de alto tactil.
   =========================================================================== */
*, *::before, *::after { box-sizing:border-box; }

:root {
  --bg:#f7f7f8;              /* fondo de la app */
  --card:#fff;
  --soft:#fafafa;            /* relleno sutil (hover, barras) */
  --ink:#18181b;             /* texto principal y acciones */
  --on-ink:#fff;             /* lo que va ENCIMA de --ink */
  --muted:#71717a;
  --faint:#a1a1aa;
  --line:#e8e8eb;            /* hairline: separadores y bordes de tarjeta */
  --line-2:#d6d6db;          /* borde de control (algo mas marcado) */
  --glass:rgba(255,255,255,.86);
  --veil:rgba(24,24,27,.32); /* fondo del modal */
  --shadow:0 12px 32px rgba(24,24,27,.16);

  --ok:#15803d;   --ok-bg:#f1faf3;   --ok-line:#9ccbaf;
  --half:#a16207; --half-bg:#fdf9ed; --half-line:#dcc588;
  --bad:#b91c1c;  --bad-bg:#fdf2f2;  --bad-line:#e6adad;

  --r:10px; --r-sm:8px;
  color-scheme:light;
}

/* Tema oscuro automatico (el sistema lo pide y el usuario no forzo claro). */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#0d0d0f; --card:#171719; --soft:#1f1f23;
    --ink:#f4f4f5; --on-ink:#0d0d0f; --muted:#a1a1aa; --faint:#6f6f78;
    --line:#26262a; --line-2:#3a3a41;
    --glass:rgba(13,13,15,.86); --veil:rgba(0,0,0,.6);
    --shadow:0 12px 32px rgba(0,0,0,.5);
    --ok:#4ade80;   --ok-bg:#122318;   --ok-line:#2c5f3d;
    --half:#fbbf24; --half-bg:#251d0f; --half-line:#6b521c;
    --bad:#f87171;  --bad-bg:#271515;  --bad-line:#6e3434;
    color-scheme:dark;
  }
}
/* Tema oscuro elegido a mano (gana sobre la preferencia del sistema). */
:root[data-theme="dark"] {
  --bg:#0d0d0f; --card:#171719; --soft:#1f1f23;
  --ink:#f4f4f5; --on-ink:#0d0d0f; --muted:#a1a1aa; --faint:#6f6f78;
  --line:#26262a; --line-2:#3a3a41;
  --glass:rgba(13,13,15,.86); --veil:rgba(0,0,0,.6);
  --shadow:0 12px 32px rgba(0,0,0,.5);
  --ok:#4ade80;   --ok-bg:#122318;   --ok-line:#2c5f3d;
  --half:#fbbf24; --half-bg:#251d0f; --half-line:#6b521c;
  --bad:#f87171;  --bad-bg:#271515;  --bad-line:#6e3434;
  color-scheme:dark;
}

html, body { margin:0; padding:0; }
body {
  background:var(--bg); color:var(--ink);
  font:15.5px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
  letter-spacing:-0.004em;
  -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;
  padding-bottom:calc(70px + env(safe-area-inset-bottom));
  overflow-x:hidden;                 /* nada debe desbordar a lo ancho en el celular */
  overscroll-behavior-y:contain;     /* sin "rebote" que arrastre la pagina de atras */
}
body.no-nav { padding-bottom:0; }
button, input, select, textarea { font:inherit; color:inherit; letter-spacing:inherit; }
button {
  cursor:pointer;
  touch-action:manipulation;              /* sin el retardo de 300ms ni zoom por doble toque */
  -webkit-tap-highlight-color:transparent;
}
/* Los controles que se tocan mucho no deben seleccionarse al mantener pulsado. */
.mark, .reason, .chip, nav.bottom button, .daybar .nav, .seg button { -webkit-user-select:none; user-select:none; }
:focus-visible { outline:2px solid var(--ink); outline-offset:2px; border-radius:4px; }
a { color:var(--ink); }
.hidden { display:none !important; }
/* Oculto a la vista pero PRESENTE: un <input type=file> con display:none no
   abre el selector en iOS ni en varios navegadores de Android. */
.vhidden {
  position:absolute; width:1px; height:1px; padding:0; margin:-1px;
  overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0;
}
svg.i { width:1em; height:1em; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; flex:none; }

/* ------------------------------------------------------------------ layout */
.wrap { max-width:640px; margin:0 auto; padding:0 16px; }

header.top {
  position:sticky; top:0; z-index:20;
  background:var(--glass); backdrop-filter:saturate(1.6) blur(10px);
  border-bottom:1px solid var(--line);
  padding:calc(11px + env(safe-area-inset-top)) 16px 11px;
}
header.top .bar { max-width:640px; margin:0 auto; display:flex; align-items:center; gap:12px; }
header.top .site { flex:1; min-width:0; }
header.top .site .lbl {
  display:block; font-size:10px; font-weight:600; text-transform:uppercase;
  letter-spacing:.1em; color:var(--faint); margin-bottom:1px;
}
header.top .site .val {
  display:flex; align-items:center; gap:5px; font-weight:600; font-size:16.5px;
  letter-spacing:-.015em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
header.top .site .val svg { color:var(--faint); width:13px; height:13px; }
header.top .brand {
  width:32px; height:32px; border-radius:8px; object-fit:cover; flex:none;
  border:1px solid var(--line); background:var(--card);
}
.brand-lg {
  width:56px; height:56px; border-radius:12px; object-fit:cover; flex:none;
  border:1px solid var(--line); background:var(--card);
}
.brand-ph {   /* marcador cuando todavia no hay logo */
  display:flex; align-items:center; justify-content:center;
  color:var(--faint); background:var(--soft);
}
.brand-ph svg { width:24px; height:24px; }
header.top button.ghost {
  background:none; border:1px solid var(--line-2); color:var(--ink); border-radius:999px;
  padding:7px 12px; font-size:13px; font-weight:500; display:flex; align-items:center; gap:6px;
}
header.top button.ghost svg { width:15px; height:15px; }

h2 { font-size:20px; font-weight:600; letter-spacing:-.02em; margin:22px 0 12px; }
h3 { font-size:11px; font-weight:600; margin:22px 0 8px; color:var(--faint); text-transform:uppercase; letter-spacing:.09em; }

/* ------------------------------------------------------------- componentes */
.card { background:var(--card); border:1px solid var(--line); border-radius:var(--r); overflow:hidden; }
.pad { padding:16px; }
.row { display:flex; align-items:center; gap:10px; }
.grow { flex:1; min-width:0; }
.muted { color:var(--muted); font-size:13px; }
.ellip { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

.btn {
  border:1px solid var(--line-2); background:var(--card); border-radius:var(--r-sm);
  padding:11px 15px; font-weight:500; font-size:15px; min-height:46px;
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  transition:background .12s, border-color .12s, opacity .12s;
}
.btn svg { width:16px; height:16px; }
.btn:hover { background:var(--soft); }
.btn.primary { background:var(--ink); border-color:var(--ink); color:var(--on-ink); font-weight:600; }
.btn.primary:hover { opacity:.88; background:var(--ink); }
.btn.dark { background:var(--ink); border-color:var(--ink); color:var(--on-ink); }
.btn.wide { width:100%; }
.btn.sm { padding:7px 12px; min-height:38px; font-size:13.5px; }
.btn.sm svg { width:14px; height:14px; }
.btn.danger { color:var(--bad); border-color:var(--bad-line); }
.btn.danger:hover { background:var(--bad-bg); }
.btn.solid-danger { background:var(--bad); border-color:var(--bad); color:#fff; font-weight:600; }
.btn[disabled] { opacity:.45; pointer-events:none; }

.field { display:block; margin:0 0 14px; }
.field span { display:block; font-size:12px; font-weight:600; color:var(--muted); margin-bottom:6px; }
.field input, .field select, .field textarea {
  width:100%; padding:11px 13px; border:1px solid var(--line-2); border-radius:var(--r-sm);
  background:var(--card); min-height:46px; font-size:15.5px;
}
.field input:focus, .field select:focus { outline:none; border-color:var(--ink); box-shadow:0 0 0 3px var(--line); }
.field input::placeholder { color:var(--faint); }

.msg { border-radius:var(--r-sm); padding:10px 13px; font-size:13.5px; margin:12px 0; }
.msg.err { background:var(--bad-bg); color:var(--bad); }
.msg.ok  { background:var(--ok-bg); color:var(--ok); }

.empty { text-align:center; color:var(--faint); padding:38px 18px; font-size:13.5px; line-height:1.6; }
.empty svg { width:26px; height:26px; margin-bottom:10px; opacity:.55; }

/* ------------------------------------------------------------ pasar lista */
/* La fecha manda: va sola, grande y sin caja. */
.daybar { display:flex; align-items:center; gap:4px; margin:18px 0 14px; }
.daybar .nav {
  width:44px; height:44px; border-radius:999px; border:0; background:none;
  color:var(--muted); display:flex; align-items:center; justify-content:center;
}
.daybar .nav svg { width:18px; height:18px; }
.daybar .nav:hover { background:var(--card); color:var(--ink); }
.daybar .day {
  flex:1; text-align:center; background:none; border:0; padding:2px;
  min-height:44px; display:flex; flex-direction:column; justify-content:center;
}
/* Solo la inicial en mayuscula: "capitalize" pondria "Jueves, 27 De Agosto". */
.cap::first-letter { text-transform:uppercase; }
.daybar .day b { font-size:16.5px; font-weight:600; letter-spacing:-.015em; }
.daybar .day small { color:var(--faint); font-size:11.5px; }

/* Resumen del dia: texto con un punto de color, no bloques rellenos. */
.chips { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; align-items:center; }
.chip {
  border-radius:999px; padding:5px 11px; font-size:12.5px; font-weight:500;
  background:var(--card); border:1px solid var(--line); color:var(--muted);
  display:inline-flex; align-items:center; gap:6px;
}
.chip.dot::before { content:""; width:6px; height:6px; border-radius:999px; background:var(--faint); }
.chip.ok::before   { background:var(--ok); }
.chip.half::before { background:var(--half); }
.chip.bad::before  { background:var(--bad); }
.chip.ok, .chip.half, .chip.bad { color:var(--ink); }
#rangeChips .chip:hover { border-color:var(--line-2); }
#rangeChips .chip.on { background:var(--ink); border-color:var(--ink); color:var(--on-ink); }

.wk { border-bottom:1px solid var(--line); padding:14px 16px; }
.wk:last-child { border-bottom:0; }
.wk .name { font-weight:500; font-size:15.5px; }
.wk .sub { font-size:12.5px; color:var(--faint); margin-top:1px; }
.marks { display:flex; gap:6px; margin-top:11px; }
.mark {
  flex:1; border:1px solid var(--line-2); background:var(--card); border-radius:var(--r-sm);
  min-height:46px; font-weight:500; font-size:13.5px; display:flex; align-items:center;
  justify-content:center; gap:5px; color:var(--muted);
  transition:background .12s, border-color .12s, color .12s;
}
.mark svg { width:15px; height:15px; }
.mark:hover { background:var(--soft); }
/* Seleccionado: tinte muy suave, borde del color y texto en negrita. */
.mark.on { font-weight:600; }
.mark.on.P { background:var(--ok-bg);   border-color:var(--ok-line);   color:var(--ok); }
.mark.on.M { background:var(--half-bg); border-color:var(--half-line); color:var(--half); }
.mark.on.A { background:var(--bad-bg);  border-color:var(--bad-line);  color:var(--bad); }

.reasons { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
.reason {
  border:1px solid var(--line); background:var(--card); border-radius:999px;
  padding:6px 12px; font-size:12.5px; color:var(--muted);
}
.reason:hover { border-color:var(--line-2); }
.reason.on { background:var(--ink); border-color:var(--ink); color:var(--on-ink); font-weight:500; }

.savebar {
  position:fixed; left:0; right:0; bottom:calc(58px + env(safe-area-inset-bottom)); z-index:15;
  padding:10px 16px; background:var(--glass); backdrop-filter:blur(8px);
  border-top:1px solid var(--line);
}
.savebar .inner { max-width:640px; margin:0 auto; }

/* --------------------------------------------------- estado de conexion --
   Solo aparece cuando hay algo que decir: sin señal, o marcas sin enviar. */
.syncbar {
  display:flex; align-items:center; gap:9px; margin:12px 0 0; padding:10px 12px;
  border-radius:var(--r-sm); font-size:13px; font-weight:500;
  background:var(--half-bg); color:var(--half); border:1px solid var(--half-line);
}
.syncbar.off { background:var(--soft); color:var(--muted); border-color:var(--line); }
.syncbar svg { width:16px; height:16px; }
.syncbar .btn { min-height:32px; padding:5px 11px; font-size:12.5px; }

/* ---------------------------------------------------------------- reporte */
.tbl { width:100%; border-collapse:collapse; font-size:14.5px; }
.tbl th, .tbl td { padding:12px 8px; border-bottom:1px solid var(--line); text-align:right; }
.tbl th:first-child, .tbl td:first-child { text-align:left; }
.tbl th {
  font-size:10.5px; text-transform:uppercase; letter-spacing:.09em;
  color:var(--faint); font-weight:600; padding-bottom:9px;
}
.tbl td { color:var(--muted); font-variant-numeric:tabular-nums; }
.tbl td:first-child { color:var(--ink); font-weight:500; max-width:200px; }
.tbl tbody tr:last-child td { border-bottom:0; }
.tbl tfoot td { font-weight:600; color:var(--ink); border-bottom:0; border-top:1px solid var(--line-2); }
.tbl td.days { font-weight:600; color:var(--ink); font-size:15px; }
.tbl tr.clickable { cursor:pointer; }
.tbl tr.clickable:hover td { background:var(--soft); }
.scroll-x { overflow-x:auto; -webkit-overflow-scrolling:touch; }

/* -------------------------------------------------------------- bottom nav */
nav.bottom {
  position:fixed; left:0; right:0; bottom:0; z-index:20;
  background:var(--glass); backdrop-filter:saturate(1.6) blur(10px);
  border-top:1px solid var(--line); display:flex; padding-bottom:env(safe-area-inset-bottom);
}
nav.bottom button {
  flex:1; border:0; background:none; padding:9px 2px; color:var(--faint);
  font-size:10.5px; font-weight:500; display:flex; flex-direction:column; align-items:center; gap:4px;
  position:relative; letter-spacing:0;
}
nav.bottom button.on { color:var(--ink); font-weight:600; }
/* Indicador del activo: una linea corta arriba, nada mas. */
nav.bottom button.on::before {
  content:""; position:absolute; top:0; left:50%; transform:translateX(-50%);
  width:26px; height:2px; background:var(--ink); border-radius:0 0 2px 2px;
}
nav.bottom svg { width:21px; height:21px; }

/* -------------------------------------------------------------------- modal */
.modal { position:fixed; inset:0; z-index:40; background:var(--veil); display:flex; align-items:flex-end; }
.modal .sheet {
  background:var(--bg); width:100%; max-height:88vh; overflow-y:auto;
  border-radius:16px 16px 0 0; padding:18px 16px calc(24px + env(safe-area-inset-bottom));
}
@media (min-width:640px) {
  .modal { align-items:center; justify-content:center; padding:20px; }
  .modal .sheet { max-width:480px; border-radius:14px; max-height:86vh; }
}
.sheet h2 { margin-top:4px; }
.list-item {
  display:flex; align-items:center; gap:12px; padding:14px 16px;
  border-bottom:1px solid var(--line); background:var(--card); width:100%; border:0; text-align:left;
  font-size:15px; color:var(--ink);
}
.list-item:hover { background:var(--soft); }
.list-item:last-child { border-bottom:0; }
.list-item > svg:first-child { width:18px; height:18px; color:var(--muted); }
.list-item .chev { width:15px; height:15px; color:var(--faint); }
.badge {
  font-size:10.5px; font-weight:600; padding:2px 8px; border-radius:999px;
  background:var(--soft); border:1px solid var(--line); color:var(--muted);
  text-transform:uppercase; letter-spacing:.05em; white-space:nowrap;
}
.badge.admin { background:var(--ink); border-color:var(--ink); color:var(--on-ink); }
.badge.off { background:var(--bad-bg); border-color:var(--bad-line); color:var(--bad); }

/* Ficha de identidad arriba de Ajustes. */
.me-row { display:flex; align-items:center; gap:13px; padding:16px; background:var(--card); }
.avatar {
  width:44px; height:44px; border-radius:999px; background:var(--ink); color:var(--on-ink);
  display:flex; align-items:center; justify-content:center; font-weight:600; font-size:16px; flex:none;
}

/* Selector segmentado (tema claro / oscuro / automatico). */
.seg { display:flex; gap:4px; padding:4px; background:var(--soft); border-radius:var(--r); }
.seg button {
  flex:1; border:0; background:none; border-radius:var(--r-sm); padding:9px 4px; min-height:44px;
  font-size:12.5px; font-weight:500; color:var(--muted);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
}
.seg button svg { width:17px; height:17px; }
.seg button.on { background:var(--card); color:var(--ink); font-weight:600; border:1px solid var(--line); }

/* ------------------------------------------------- dialogo de confirmacion --
   Reemplaza a confirm()/alert() del navegador: los nativos se ven mal en el
   celular y, sobre todo, CONGELAN la pagina mientras estan abiertos.
   Va por encima del modal normal para poder preguntar desde dentro de una ficha. */
.dlg { z-index:60; align-items:center; justify-content:center; padding:22px; }
.dlg-box {
  background:var(--card); width:100%; max-width:360px; border-radius:14px; padding:22px 20px 18px;
  border:1px solid var(--line); box-shadow:var(--shadow); animation:pop .13s ease-out;
}
@keyframes pop { from { transform:scale(.96); opacity:0; } to { transform:scale(1); opacity:1; } }
.dlg-box h3 {
  margin:0 0 7px; font-size:16.5px; font-weight:600; color:var(--ink);
  text-transform:none; letter-spacing:-.015em;
}
.dlg-box p { margin:0 0 18px; font-size:14px; line-height:1.55; color:var(--muted); }
.dlg-actions { display:flex; gap:8px; }
.dlg-actions .btn { flex:1; }

/* -------------------------------------------------------------------- toast */
.toast {
  position:fixed; left:50%; transform:translateX(-50%);
  bottom:calc(76px + env(safe-area-inset-bottom)); z-index:70;
  max-width:calc(100% - 32px); padding:11px 17px; border-radius:999px;
  font-size:14px; font-weight:500; color:var(--on-ink); background:var(--ink);
  box-shadow:var(--shadow); animation:pop .13s ease-out;
  display:flex; align-items:center; gap:8px;
}
.toast svg { width:16px; height:16px; }
.toast.err { background:var(--bad); color:#fff; }

/* ------------------------------------------------------ pantallas angostas --
   A partir de aqui manda el celular chico (360px y similares): se aprieta el
   espaciado para que los tres botones de marcar sigan entrando en una fila. */
@media (max-width:400px) {
  .wrap { padding:0 12px; }
  header.top { padding-left:12px; padding-right:12px; }
  .wk { padding:13px; }
  .marks { gap:5px; }
  .mark { font-size:12.5px; gap:4px; }
  .mark svg { width:14px; height:14px; }
  .reason { padding:6px 10px; font-size:12px; }
  .chip { padding:5px 9px; font-size:12px; }
  .tbl th, .tbl td { padding:11px 5px; }
  .tbl td:first-child { max-width:42vw; }
  h2 { font-size:19px; }
}
/* Pantallas muy chicas (<=330px): los botones pasan a solo el simbolo. */
@media (max-width:330px) {
  .mark .lbl { display:none; }
  .mark svg { width:17px; height:17px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration:.01ms !important; transition-duration:.01ms !important; }
}
</style>
</head>
<body class="no-nav">

<!-- ===================== LOGIN ===================== -->
<section id="login" class="wrap" style="max-width:400px; padding-top:52px;">
  <div style="text-align:center; margin-bottom:26px;">
    <div id="loginMark" style="display:inline-flex; width:52px; height:52px; align-items:center;

/* ===========================================================================

/* --------------------------------- fechas --------------------------------
   Todo el sistema usa la hora de NICARAGUA (America/Managua, UTC-6 todo el
   año). No la del telefono: un equipo con la zona mal configurada marcaria el
   dia equivocado. El servidor usa exactamente la misma referencia.
-------------------------------------------------------------------------- */
const TZ_OBRA = "America/Managua";
const dayFmt = new Intl.DateTimeFormat("en-CA", {   // en-CA formatea YYYY-MM-DD
  timeZone: TZ_OBRA, year: "numeric", month: "2-digit", day: "2-digit",
});

// Hoy en la obra.
const todayObra = () => dayFmt.format(new Date());

// YYYY-MM-DD de un Date "suelto" (para aritmetica de calendario, sin zonas).
const ymd = (dt) => `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}-${String(dt.getDate()).padStart(2, "0")}`;

// Hoy como Date, para poder sumar y restar dias y meses.
function hoyDate() {
  const [y, m, d] = todayObra().split("-").map(Number);
  return new Date(y, m - 1, d);
}

function shiftDay(day, n) {
  const [y, m, d] = day.split("-").map(Number);
  return ymd(new Date(y, m - 1, d + n));
}

/* ---------------------------------- logo ---------------------------------
   La foto de la empresa se guarda como data URI JPEG dentro de la cuenta: son
   unos pocos KB, viaja con la sesion y sirve sin conexion.

   Se convierte SIEMPRE a JPEG, y sobre fondo blanco. Es el unico formato que se
   puede incrustar tal cual en un PDF (filtro DCTDecode), asi que asi el mismo
   archivo sirve para la pantalla y para el papel.
-------------------------------------------------------------------------- */
const LOGO_MAX = 320;                 // lado mayor, en pixeles

async function fileToLogo(file) {
  if (!file.type.startsWith("image/")) throw new Error("Elige una imagen.");

  // Se lee como data URI y NO con URL.createObjectURL. La CSP del sitio permite
  // `data:` en img-src pero no `blob:`, asi que una URL de blob la bloquea el
  // navegador en produccion y la imagen nunca carga.
  const uri = await new Promise((ok, fail) => {
    const fr = new FileReader();
    fr.onload = () => ok(fr.result);
    fr.onerror = () => fail(new Error("No se pudo leer el archivo."));
    fr.readAsDataURL(file);
  });

  const img = new Image();
  await new Promise((ok, fail) => {
    img.onload = ok;
    img.onerror = () => fail(new Error("No se pudo leer esa imagen. Prueba con una foto JPG o PNG."));
    img.src = uri;
  });

  const escala = Math.min(1, LOGO_MAX / Math.max(img.width, img.height));
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(img.width * escala));
  c.height = Math.max(1, Math.round(img.height * escala));
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#fff";                     // JPEG no tiene transparencia
  ctx.fillRect(0, 0, c.width, c.height);
  ctx.drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", 0.85);
}

// data URI -> cadena binaria (un caracter por byte), que es como escribe el PDF.
function dataUriToBinary(uri) {
  try { return atob(String(uri).split(",")[1] || ""); } catch { return ""; }
}

// Ancho y alto leidos del propio JPEG (marcador SOF). Evita guardar las medidas
// aparte: cualquier logo ya almacenado se puede medir igual.
function jpegSize(bin) {
  for (let i = 2; i + 9 < bin.length; ) {
    if (bin.charCodeAt(i) !== 0xFF) { i++; continue; }
    const m = bin.charCodeAt(i + 1);
    if (m >= 0xC0 && m <= 0xCF && m !== 0xC4 && m !== 0xC8 && m !== 0xCC) {
      return {
        h: (bin.charCodeAt(i + 5) << 8) | bin.charCodeAt(i + 6),
        w: (bin.charCodeAt(i + 7) << 8) | bin.charCodeAt(i + 8),
      };
    }
    const len = (bin.charCodeAt(i + 2) << 8) | bin.charCodeAt(i + 3);
    if (len <= 0) break;
    i += 2 + len;
  }
  return null;
}

// Logo listo para el PDF, o null si la cuenta no tiene.
function logoParaPdf() {
  const uri = S.account?.logo;
  if (!uri) return null;
  const bin = dataUriToBinary(uri);
  const size = bin && jpegSize(bin);
  return size ? { bin, ...size } : null;
}

// <svg> listo para insertar. `cls` permite ajustar tamaño con una clase extra.
function icon(name, cls = "") {
  return `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name] || ""}</svg>`;
}

/* --------------------------------- tema ---------------------------------- */
// "auto" sigue al sistema; "light"/"dark" lo fuerzan. Se guarda por dispositivo.
const THEMES = [
  ["auto",  "Automático", "auto"],
  ["light", "Claro",      "sun"],
  ["dark",  "Oscuro",     "moon"],
];

function currentTheme() {
  const t = localStorage.getItem("ao_theme");
  return THEMES.some((x) => x[0] === t) ? t : "auto";
}

function applyTheme(t) {
  const pref = THEMES.some((x) => x[0] === t) ? t : "auto";
  localStorage.setItem("ao_theme", pref);
  // "auto" = sin atributo, para que mande la media query prefers-color-scheme.
  if (pref === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", pref);
  // La barra del navegador en el celular tiene que acompañar al tema.
  const dark = pref === "dark" ||
    (pref === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.querySelector('meta[name="theme-color"]').content = dark ? "#0d0d0f" : "#ffffff";
}

/* --------------------------------- API ---------------------------------- */
async function api(path, { method = "GET", body } = {}) {
  let res;
  try {
    res = await fetch(path, {
      method,
      headers: {
        ...(body ? { "content-type": "application/json" } : {}),
        ...(S.token ? { "x-session-token": S.token } : {}),
      },
      body: body ? JSON.stringify(body) : undefined,
    });
  } catch {
    // La peticion no llego a salir: no hay red. Se marca con `offline` para que
    // quien llama pueda tirar del cache o encolar, en vez de tratarlo como error.
    S.offline = true;
    renderSyncBar();
    const e = new Error("Sin conexión.");
    e.offline = true;
    throw e;
  }
  if (S.offline) { S.offline = false; renderSyncBar(); }   // volvio la señal
  let data = {};
  try { data = await res.json(); } catch {}
  if (res.status === 401 && S.token) { logout(); throw new Error("Sesión expirada. Vuelve a entrar."); }
  if (!res.ok) throw new Error(data.error || `Error ${res.status}`);
  return data;
}

/* --------------------------- avisos y preguntas -------------------------- */
// Aviso breve que no interrumpe (reemplaza a alert()).
let toastTimer = null;
function toast(text, kind = "ok") {
  document.querySelectorAll(".toast").forEach((t) => t.remove());
  const el = document.createElement("div");
  el.className = `toast ${kind === "err" ? "err" : ""}`;
  el.setAttribute("role", "status");
  el.innerHTML = icon(kind === "err" ? "info" : "check") + `<span>${esc(text)}</span>`;
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), kind === "err" ? 4000 : 2600);
}

// Pregunta de si/no. Reemplaza a confirm(): el nativo se ve mal en el celular y
// congela la pagina entera mientras esta abierto. Devuelve una promesa -> se usa
// con `if (!(await ask({...}))) return;`.
function ask({ title, text = "", ok = "Aceptar", cancel = "Cancelar", danger = false }) {
  return new Promise((resolve) => {
    const root = $("dialogRoot");
    root.innerHTML = `
      <div class="modal dlg" role="dialog" aria-modal="true">
        <div class="dlg-box">
          <h3>${esc(title)}</h3>
          ${text ? `<p>${esc(text)}</p>` : ""}
          <div class="dlg-actions">
            <button class="btn" data-r="0">${esc(cancel)}</button>
            <button class="btn ${danger ? "solid-danger" : "primary"}" data-r="1">${esc(ok)}</button>
          </div>
        </div>
      </div>`;
    const done = (v) => { document.removeEventListener("keydown", onKey); root.innerHTML = ""; resolve(v); };
    const onKey = (e) => {
      if (e.key === "Escape") done(false);
      else if (e.key === "Enter") done(true);
    };
    document.addEventListener("keydown", onKey);
    root.querySelectorAll("[data-r]").forEach((b) =>
      b.addEventListener("click", () => done(b.dataset.r === "1")));
    // Tocar fuera del cuadro = cancelar.
    root.querySelector(".modal").addEventListener("click", (e) => {
      if (e.target.classList.contains("modal")) done(false);
    });
    root.querySelector('[data-r="1"]').focus();
  });
}

/* ===========================================================================
   Trabajar sin conexion

   En obra la señal es mala, asi que la app no puede depender de la red para
   pasar lista:

   - Lo que se ve se guarda en el telefono (obras, personal del dia, ultimo
     estado conocido de cada fecha). Sin red se muestra eso.
   - Lo que se marca sin red va a una COLA. La cola manda sobre lo que diga el
     cache: es lo mas nuevo que sabe este telefono.
   - Al volver la señal se envia sola (y tambien con el boton "Sincronizar").

   La cola guarda una entrada por (obra, dia, trabajador): volver a marcar al
   mismo pisa la anterior, no se acumulan. Si el envio falla, la entrada se
   CONSERVA: nunca se descarta una marca en silencio.
   =========================================================================== */
const QUEUE_KEY = "ao_queue";
const dayKey = (siteId, day) => `ao_day_${siteId}_${day}`;

const store = {
  get(k, def = null) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch { return def; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } },
};

const queueGet = () => store.get(QUEUE_KEY, []);

// Agrega o pisa marcas en la cola. Devuelve cuantas quedan pendientes.
function queueAdd(siteId, day, marks) {
  const q = queueGet();
  for (const m of marks) {
    const i = q.findIndex((x) => x.siteId === siteId && x.day === day && x.workerId === m.workerId);
    const entry = { siteId, day, workerId: m.workerId, status: m.status || "", reason: m.reason || null, at: Date.now() };
    if (i >= 0) q[i] = entry; else q.push(entry);
  }
  store.set(QUEUE_KEY, q);
  return q.length;
}

// Vuelca sobre la lista en pantalla las marcas pendientes de ESTE dia y obra.
function applyQueueTo(workers) {
  const pend = queueGet().filter((e) => e.siteId === S.siteId && e.day === S.day);
  for (const e of pend) {
    const w = workers.find((x) => x.id === e.workerId);
    if (!w) continue;
    w.status = e.status || null;
    w.reason = e.reason || null;
    w.pending = true;
  }
  return pend.length;
}

// Envia la cola agrupada por (obra, dia): una sola llamada por lista.
async function syncQueue({ silent = true } = {}) {
  const q = queueGet();
  if (!q.length || S.syncing) return 0;
  S.syncing = true;
  renderSyncBar();

  const groups = new Map();
  for (const e of q) {
    const k = `${e.siteId}|${e.day}`;
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(e);
  }

  let done = 0;
  const left = [];
  for (const [k, entries] of groups) {
    const [siteId, day] = k.split("|");
    try {
      await api("/api/attendance", { method: "POST", body: {
        siteId: Number(siteId), day,
        marks: entries.map((e) => ({ workerId: e.workerId, status: e.status, reason: e.reason })),
      }});
      done += entries.length;
    } catch (err) {
      // Falle por lo que falle (sin red, sesion vencida, servidor caido), la
      // marca se conserva y se reintenta despues. Perderla seria peor.
      left.push(...entries);
      if (!silent && !err.offline) toast(err.message, "err");
    }
  }
  store.set(QUEUE_KEY, left);
  S.syncing = false;
  renderSyncBar();
  if (done && !silent) toast(plural(done, "marca sincronizada", "marcas sincronizadas"));
  return done;
}

// Barra de estado: solo aparece si hay algo que decir (sin red o cola pendiente).
function renderSyncBar() {
  const el = $("syncBar");
  if (!el) return;
  const n = queueGet().length;
  const off = S.offline || !navigator.onLine;
  if (!n && !off) { el.classList.add("hidden"); return; }

  el.className = `syncbar ${off ? "off" : ""}`;
  el.innerHTML =
    icon(off ? "offline" : "cloud") +
    `<span class="grow">${
      S.syncing ? "Sincronizando…"
      : off ? (n ? `Sin conexión · ${plural(n, "marca guardada aquí", "marcas guardadas aquí")}`
                 : "Sin conexión · puedes seguir pasando lista")
      : plural(n, "marca sin enviar", "marcas sin enviar")
    }</span>` +
    (n && !off && !S.syncing ? `<button class="btn sm" id="syncNow">Sincronizar</button>` : "");

  const b = $("syncNow");
  if (b) b.addEventListener("click", async () => {
    if (await syncQueue({ silent: false }) && S.view === "list") loadDay();
  });
}

// Al recuperar la señal se envia sola; al perderla, solo se avisa.
addEventListener("online", async () => {
  S.offline = false;
  renderSyncBar();
  if (await syncQueue({ silent: false }) && S.view === "list") loadDay();
});
addEventListener("offline", () => { S.offline = true; renderSyncBar(); });

   Login / sesion
   =========================================================================== */
// La pantalla de entrada hace dos cosas: entrar, o dar de alta una EMPRESA
// nueva (que crea su cuenta aislada y a su primer administrador).
let signupMode = false;
$("switchMode").addEventListener("click", () => {
  signupMode = !signupMode;
  $("companyField").classList.toggle("hidden", !signupMode);
  $("loginCompany").required = signupMode;
  $("loginSubmit").textContent = signupMode ? "Crear cuenta" : "Entrar";
  $("switchText").textContent = signupMode ? "¿Ya tienes cuenta?" : "¿Tu empresa todavía no está?";
  $("switchMode").textContent = signupMode ? "Entrar" : "Crear cuenta";
  $("loginMsg").innerHTML = "";
});

$("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = $("loginSubmit");
  btn.disabled = true;
  $("loginMsg").innerHTML = "";
  try {
    const r = signupMode
      ? await api("/api/auth?signup=1", { method: "POST", body: {
          company: $("loginCompany").value.trim(),
          name: $("loginName").value.trim(),
          password: $("loginPw").value,
        }})
      : await api("/api/auth", { method: "POST", body: {
          name: $("loginName").value.trim(), password: $("loginPw").value,
        }});
    S.token = r.token; S.me = r.user; S.account = r.account || null;
    localStorage.setItem("ao_token", S.token);
    localStorage.setItem("ao_me", JSON.stringify(S.me));
    localStorage.setItem("ao_account", JSON.stringify(S.account));
    $("loginPw").value = "";
    // Empresa recien creada: no hay obras ni personal, se parte por ahi.
    if (r.created) { await start(); return sitesScreen(); }
    await start();
  } catch (err) {
    $("loginMsg").innerHTML = `<div class="msg err">${esc(err.message)}</div>`;
  } finally { btn.disabled = false; }
});

function logout() {
  S.token = ""; S.me = null; S.account = null; S.dirty.clear();
  localStorage.removeItem("ao_token");
  localStorage.removeItem("ao_me");
  localStorage.removeItem("ao_account");
  $("app").classList.add("hidden");
  $("login").classList.remove("hidden");
  document.body.classList.add("no-nav");
}

// Muestra el logo de la empresa en la cabecera (o lo esconde si no hay).
function paintBrand() {
  const el = $("brandLogo");
  if (!el) return;
  const uri = S.account?.logo;
  if (uri) { el.src = uri; el.alt = S.account?.name || ""; el.classList.remove("hidden"); }
  else { el.removeAttribute("src"); el.classList.add("hidden"); }
}

/* ===========================================================================
   Arranque
   =========================================================================== */
async function start() {
  $("meBtn").textContent = initials(S.me?.fullName || S.me?.name);
  paintBrand();
  $("login").classList.add("hidden");
  $("app").classList.remove("hidden");
  document.body.classList.remove("no-nav");
  await loadSites();
  setView(S.view);
}

async function loadSites() {
  let sites;
  try {
    ({ sites } = await api("/api/sites"));
    store.set("ao_sites", sites);            // para poder elegir obra sin red
  } catch (err) {
    if (!err.offline) throw err;
    sites = store.get("ao_sites", []);
  }
  S.sites = sites;
  if (!sites.length) { S.siteId = null; $("siteName").textContent = "Sin obras"; return; }
  if (!S.siteId || !sites.some((s) => s.id === S.siteId)) S.siteId = sites[0].id;
  localStorage.setItem("ao_site", S.siteId);
  $("siteName").textContent = sites.find((s) => s.id === S.siteId).name;
}

document.querySelectorAll("nav.bottom button").forEach((b) => {
  b.addEventListener("click", () => setView(b.dataset.view));
});

async function setView(v) {
  if (S.dirty.size && v !== "list" && !(await ask({
    title: "Tienes marcas sin guardar",
    text: `${S.dirty.size} ${S.dirty.size === 1 ? "trabajador quedó marcado" : "trabajadores quedaron marcados"} sin guardar. Si sales ahora se pierden.`,
    ok: "Salir sin guardar", cancel: "Seguir aquí", danger: true,
  }))) return;
  S.view = v;
  document.querySelectorAll("nav.bottom button").forEach((b) => b.classList.toggle("on", b.dataset.view === v));
  for (const [name, el] of Object.entries({
    list: $("viewList"), report: $("viewReport"), staff: $("viewStaff"), settings: $("viewSettings"),
  })) el.classList.toggle("hidden", name !== v);
  $("saveBar").classList.toggle("hidden", v !== "list" || !S.dirty.size);
  window.scrollTo(0, 0);

  if (v === "list") loadDay();
  if (v === "report") loadReport();
  if (v === "staff") loadStaff();
  if (v === "settings") renderSettings();
}

/* ===========================================================================
   Vista: pasar lista
   =========================================================================== */
const REASONS = ["Falta", "Permiso", "Licencia", "Lluvia", "Feriado", "Accidente"];
// El medio dia va como "½": ningun icono lo dice tan claro.
const MARK_ICON = { P: icon("check"), M: '<span style="font-size:17px; line-height:1;">&#189;</span>', A: icon("cross") };
const MARK_LABEL = { P: "Presente", M: "Medio", A: "Falta" };

$("dayPrev").addEventListener("click", () => goDay(shiftDay(S.day, -1)));
$("dayNext").addEventListener("click", () => goDay(shiftDay(S.day, 1)));
$("dayInput").addEventListener("change", (e) => { if (e.target.value) goDay(e.target.value); });

async function goDay(day) {
  if (S.dirty.size && !(await ask({
    title: "Tienes marcas sin guardar",
    text: "Si cambias de día se pierden las marcas que no guardaste.",
    ok: "Cambiar igual", cancel: "Seguir aquí", danger: true,
  }))) return;
  S.day = day; S.dirty.clear(); loadDay();
}

async function loadDay() {
  $("dayLabel").textContent = prettyDay(S.day);
  $("dayInput").value = S.day;
  $("dayNote").textContent =
    S.day === todayObra() ? "hoy" : (isWeekend(S.day) ? "fin de semana" : "");

  if (!S.siteId) {
    $("workerList").innerHTML = emptyState("building", "No hay obras todavía.<br>Créala en <b>Ajustes → Obras</b>.");
    $("summary").innerHTML = "";
    return;
  }
  $("workerList").innerHTML = `<div class="empty">Cargando…</div>`;
  try {
    const r = await api(`/api/attendance?siteId=${S.siteId}&day=${S.day}`);
    S.workers = r.workers;
    store.set(dayKey(S.siteId, S.day), r.workers);   // ultimo estado conocido
  } catch (err) {
    if (!err.offline) {
      $("workerList").innerHTML = emptyState("info", esc(err.message));
      return;
    }
    const cached = store.get(dayKey(S.siteId, S.day));
    if (!cached) {
      $("workerList").innerHTML = emptyState("offline",
        "Sin conexión y este día nunca se abrió en este teléfono.<br>Vuelve a intentarlo con señal.");
      $("summary").innerHTML = "";
      renderSyncBar();
      return;
    }
    S.workers = cached.map((w) => ({ ...w }));
  }
  applyQueueTo(S.workers);        // lo pendiente manda sobre lo del servidor
  S.dirty.clear();
  renderDay();
  renderSyncBar();
}

function renderDay() {
  const w = S.workers;
  if (!w.length) {
    $("summary").innerHTML = "";
    $("workerList").innerHTML = emptyState("people", "Esta obra no tiene personal.<br>Agrégalo en <b>Personal</b>.");
    $("saveBar").classList.add("hidden");
    return;
  }
  const n = (st) => w.filter((x) => x.status === st).length;
  const pend = w.length - n("P") - n("M") - n("A");
  const jornadas = n("P") + n("M") * 0.5;
  $("summary").innerHTML =
    `<span class="chip dot ok">${plural(n("P"), "presente", "presentes")}</span>` +
    `<span class="chip dot half">${plural(n("M"), "medio día", "medios días")}</span>` +
    `<span class="chip dot bad">${plural(n("A"), "falta", "faltas")}</span>` +
    (pend ? `<span class="chip dot">${pend} sin marcar</span>` : "") +
    `<span class="chip">${fmtDays(jornadas)} ${jornadas === 1 ? "jornada" : "jornadas"}</span>`;

  $("workerList").innerHTML = w.map((x) => `
    <div class="wk" data-id="${x.id}">
      <div class="row">
        <div class="grow">
          <div class="name ellip">${esc(x.fullName)}</div>
          <div class="sub ellip">${esc(x.trade || "—")}${
            x.pending ? ' · <b style="color:var(--half);">sin enviar</b>'
                      : x.markedByName ? ` · marcó ${esc(x.markedByName)}` : ""}</div>
        </div>
      </div>
      <div class="marks">
        ${["P", "M", "A"].map((st) => `
          <button class="mark ${st} ${x.status === st ? "on" : ""}" data-mark="${st}"
                  aria-pressed="${x.status === st}" aria-label="${MARK_LABEL[st]} — ${esc(x.fullName)}">
            ${MARK_ICON[st]} <span class="lbl">${MARK_LABEL[st]}</span>
          </button>`).join("")}
      </div>
      ${x.status && x.status !== "P" ? `
        <div class="reasons">
          ${REASONS.map((r) => `<button class="reason ${x.reason === r ? "on" : ""}" data-reason="${esc(r)}">${esc(r)}</button>`).join("")}
        </div>` : ""}
    </div>`).join("");

  $("saveBar").classList.toggle("hidden", !S.dirty.size || S.view !== "list");
  $("saveBtn").textContent = S.dirty.size ? `Guardar lista (${S.dirty.size})` : "Guardar lista";
}

// Delegacion: marcar estado y elegir motivo.
$("workerList").addEventListener("click", (e) => {
  const wk = e.target.closest(".wk");
  if (!wk) return;
  const id = Number(wk.dataset.id);
  const w = S.workers.find((x) => x.id === id);
  if (!w) return;

  const markBtn = e.target.closest("[data-mark]");
  if (markBtn) {
    const st = markBtn.dataset.mark;
    w.status = w.status === st ? null : st;   // volver a tocar el mismo estado lo desmarca
    if (w.status === "P" || !w.status) w.reason = null;
    S.dirty.add(id);
    renderDay();
    return;
  }
  const reasonBtn = e.target.closest("[data-reason]");
  if (reasonBtn) {
    const r = reasonBtn.dataset.reason;
    w.reason = w.reason === r ? null : r;
    S.dirty.add(id);
    renderDay();
  }
});

$("allPresent").addEventListener("click", () => {
  S.workers.forEach((w) => { if (!w.status) { w.status = "P"; w.reason = null; S.dirty.add(w.id); } });
  renderDay();
});
$("clearAll").addEventListener("click", async () => {
  if (!(await ask({
    title: "¿Limpiar el día?",
    text: "Se quitan todas las marcas de esta fecha. Recuerda guardar para que el cambio quede registrado.",
    ok: "Limpiar", cancel: "Cancelar", danger: true,
  }))) return;
  S.workers.forEach((w) => { w.status = null; w.reason = null; S.dirty.add(w.id); });
  renderDay();
});

$("saveBtn").addEventListener("click", async () => {
  if (!S.dirty.size) return;
  const btn = $("saveBtn");
  btn.disabled = true; btn.textContent = "Guardando…";
  // Fuera del try a proposito: el catch tambien necesita `marks` para encolarlas
  // cuando no hay red (una `const` dentro del try no se ve desde el catch).
  const marks = [...S.dirty].map((id) => {
    const w = S.workers.find((x) => x.id === id);
    return { workerId: id, status: w.status || "", reason: w.reason || null };
  });
  try {
    await api("/api/attendance", { method: "POST", body: { siteId: S.siteId, day: S.day, marks } });
    S.dirty.clear();
    toast("Lista guardada");
    await loadDay();
  } catch (err) {
    if (!err.offline) { toast(err.message, "err"); return; }
    // Sin red la lista NO se pierde: queda en el telefono y se envia despues.
    queueAdd(S.siteId, S.day, marks);
    S.dirty.clear();
    applyQueueTo(S.workers);
    store.set(dayKey(S.siteId, S.day), S.workers);
    toast("Guardado aquí. Se enviará al volver la señal.");
    renderSyncBar();
  } finally { btn.disabled = false; renderDay(); }
});


/* ===========================================================================
   PDF

   Generador minimo, escrito a mano. Un PDF es texto plano con una tabla de
   posiciones al final, asi que para tablas y titulos no hace falta ninguna
   libreria: no se toca el CSP, no hay 350 KB que bajar y funciona sin señal.

   Usa las fuentes Helvetica que todo lector de PDF ya trae (no se incrusta
   ninguna) con codificacion WinAnsi, que incluye tildes y eñes.
   =========================================================================== */

// Ancho de cada caracter en Helvetica, en milesimas de punto. Hace falta para
// alinear numeros a la derecha; los digitos miden todos 556, asi que las
// columnas de plata quedan perfectamente cuadradas.
const HELV_W = (() => {
  const w = {};
  const put = (chars, val) => [...chars].forEach((c) => { w[c] = val; });
  put(" ", 278); put("!", 278); put('"', 355); put("#$", 556); put("%", 889); put("&", 667);
  put("'", 191); put("()", 333); put("*", 389); put("+", 584); put(",", 278); put("-", 333);
  put(".", 278); put("/", 278); put("0123456789", 556); put(":;", 278); put("<=>", 584);
  put("?", 556); put("@", 1015);
  put("ADEHKNOQRSTUVXYZBCFGIJLMPW", 667);   // base; se afinan las distintas abajo
  put("C", 722); put("D", 722); put("G", 778); put("I", 278); put("J", 500); put("L", 556);
  put("M", 833); put("N", 722); put("O", 778); put("Q", 778); put("R", 722); put("T", 611);
  put("U", 722); put("W", 944); put("Z", 611); put("F", 611);
  put("abcdeghknopqsuvxyz", 556);
  put("c", 500); put("f", 278); put("i", 222); put("j", 222); put("k", 500); put("l", 222);
  put("m", 833); put("r", 333); put("s", 500); put("t", 278); put("v", 500); put("w", 722);
  put("x", 500); put("y", 500); put("z", 500);
  put("[]\\", 278); put("^", 469); put("_", 556); put("`", 333); put("{}", 334); put("|", 260); put("~", 584);
  return w;
})();

const textWidth = (str, size) =>
  [...String(str)].reduce((t, c) => t + (HELV_W[c] ?? 556), 0) * size / 1000;

// Recorta el texto con "…" si no cabe en el ancho dado.
function fitText(str, size, max) {
  let t = String(str);
  if (textWidth(t, size) <= max) return t;
  while (t.length > 1 && textWidth(t + "…", size, max) > max) t = t.slice(0, -1);
  return t + "…";
}

class MiniPdf {
  // `logo` = { bin, w, h } con el JPEG crudo. Se incrusta una sola vez y se
  // referencia desde todas las paginas.
  constructor({ logo = null } = {}) {
    this.W = 595; this.H = 842;      // A4 en puntos
    this.logo = logo;
    this.pages = [];
    this.newPage();
  }
  newPage() { this.buf = []; this.pages.push(this.buf); return this; }

  // Coordenadas desde ARRIBA-izquierda, que es como se piensa una hoja.
  // El PDF las cuenta desde abajo, asi que se invierte aqui y no en cada llamada.
  text(x, y, str, { size = 10, bold = false, align = "left", gray = 0 } = {}) {
    let t = String(str ?? "");
    if (align === "right") x -= textWidth(t, size);
    else if (align === "center") x -= textWidth(t, size) / 2;
    const esc = t.replace(/[\\()]/g, (c) => "\\" + c);
    this.buf.push(
      `BT ${gray} g /${bold ? "F2" : "F1"} ${size} Tf 1 0 0 1 ${x.toFixed(2)} ${(this.H - y).toFixed(2)} Tm (${esc}) Tj ET`
    );
    return this;
  }
  line(x1, y1, x2, y2, { width = 0.6, gray = 0.8 } = {}) {
    this.buf.push(`${gray} G ${width} w ${x1.toFixed(2)} ${(this.H - y1).toFixed(2)} m ${x2.toFixed(2)} ${(this.H - y2).toFixed(2)} l S`);
    return this;
  }
  // Dibuja el logo conservando su proporcion dentro de la caja (w x h).
  image(x, y, w, h) {
    if (!this.logo) return this;
    const escala = Math.min(w / this.logo.w, h / this.logo.h);
    const iw = this.logo.w * escala, ih = this.logo.h * escala;
    this.buf.push(`q ${iw.toFixed(2)} 0 0 ${ih.toFixed(2)} ${x.toFixed(2)} ${(this.H - y - ih).toFixed(2)} cm /Im0 Do Q`);
    return this;
  }
  rect(x, y, w, h, gray = 0.95) {
    this.buf.push(`${gray} g ${x.toFixed(2)} ${(this.H - y - h).toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re f`);
    return this;
  }

  blob() {
    const objs = [];
    const add = (body) => { objs.push(body); return objs.length; };   // devuelve el numero de objeto

    const catalogN = add("");            // 1: se rellena al final (necesita el id de Pages)
    const pagesN = add("");              // 2: idem (necesita los ids de las paginas)
    const f1 = add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>");
    const f2 = add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>");

    // El JPEG entra tal cual: DCTDecode es justamente el filtro JPEG del PDF,
    // asi que no hay que descomprimir ni recodificar nada.
    let imgN = 0;
    if (this.logo) {
      imgN = add(
        `<< /Type /XObject /Subtype /Image /Width ${this.logo.w} /Height ${this.logo.h} ` +
        `/ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${this.logo.bin.length} >>\n` +
        `stream\n${this.logo.bin}\nendstream`
      );
    }

    const pageIds = [];
    for (const buf of this.pages) {
      const stream = buf.join("\n");
      const contN = add(`<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`);
      pageIds.push(add(
        `<< /Type /Page /Parent ${pagesN} 0 R /MediaBox [0 0 ${this.W} ${this.H}] ` +
        `/Resources << /Font << /F1 ${f1} 0 R /F2 ${f2} 0 R >>` +
        (imgN ? ` /XObject << /Im0 ${imgN} 0 R >>` : "") + ` >> /Contents ${contN} 0 R >>`
      ));
    }
    objs[catalogN - 1] = `<< /Type /Catalog /Pages ${pagesN} 0 R >>`;
    objs[pagesN - 1] = `<< /Type /Pages /Kids [${pageIds.map((n) => n + " 0 R").join(" ")}] /Count ${pageIds.length} >>`;

    let out = "%PDF-1.4\n";
    const offsets = [];
    objs.forEach((body, i) => {
      offsets.push(out.length);
      out += `${i + 1} 0 obj\n${body}\nendobj\n`;
    });
    const xref = out.length;
    out += `xref\n0 ${objs.length + 1}\n0000000000 65535 f \n`;
    for (const off of offsets) out += String(off).padStart(10, "0") + " 00000 n \n";
    out += `trailer\n<< /Size ${objs.length + 1} /Root ${catalogN} 0 R >>\nstartxref\n${xref}\n%%EOF`;

    // Todo el contenido es Latin-1, asi que cada caracter es exactamente un byte.
    const bytes = new Uint8Array(out.length);
    for (let i = 0; i < out.length; i++) bytes[i] = out.charCodeAt(i) & 0xff;
    return new Blob([bytes], { type: "application/pdf" });
  }
}

/* --------------------------- armado de reportes -------------------------- */
const M = 45;                 // margen
const FONT_OK = (t) => String(t ?? "").replace(/[^\x20-\xFF]/g, "?");   // fuera de WinAnsi

// Encabezado comun: logo, empresa, obra y periodo.
function pdfHeader(doc, titulo, sub) {
  doc.text(M, M + 6, FONT_OK(S.account?.name || "Asistencia en Obra"), { size: 9, gray: 0.45 });
  doc.text(M, M + 30, FONT_OK(titulo), { size: 19, bold: true });
  doc.text(M, M + 48, FONT_OK(sub), { size: 9.5, gray: 0.4 });
  doc.image(595 - M - 46, M - 6, 46, 46);       // logo arriba a la derecha
  doc.line(M, M + 58, 595 - M, M + 58);
  return M + 84;              // y donde sigue el contenido
}

function pdfFooter(doc, pag) {
  doc.text(M, 842 - 32, `Generado el ${new Date().toLocaleString("es-NI", { timeZone: TZ_OBRA })}`, { size: 7.5, gray: 0.55 });
  doc.text(595 - M, 842 - 32, `Página ${pag}`, { size: 7.5, gray: 0.55, align: "right" });
}

// Reporte de la obra completa.
function reportPdf(r) {
  const doc = new MiniPdf({ logo: logoParaPdf() });
  const obra = S.sites.find((x) => x.id === S.siteId)?.name || "Obra";
  let y = pdfHeader(doc, obra, `Del ${r.from} al ${r.to}`);
  let pag = 1;

  const cols = [M, 285, 360, 435, 595 - M];   // nombre | dias | ganado | abonos | a recibir
  const head = () => {
    doc.text(cols[0], y, "TRABAJADOR", { size: 7.5, bold: true, gray: 0.45 });
    doc.text(cols[1], y, "DÍAS", { size: 7.5, bold: true, gray: 0.45, align: "right" });
    doc.text(cols[2], y, "GANADO", { size: 7.5, bold: true, gray: 0.45, align: "right" });
    doc.text(cols[3], y, "ABONOS", { size: 7.5, bold: true, gray: 0.45, align: "right" });
    doc.text(cols[4], y, "A RECIBIR", { size: 7.5, bold: true, gray: 0.45, align: "right" });
    y += 6; doc.line(M, y, 595 - M, y); y += 15;
  };
  head();

  for (const x of r.rows) {
    if (y > 842 - 70) {                       // salto de pagina
      pdfFooter(doc, pag++); doc.newPage(); y = pdfHeader(doc, obra, `Del ${r.from} al ${r.to}`); head();
    }
    doc.text(cols[0], y, FONT_OK(fitText(x.fullName + (x.active ? "" : " (baja)"), 9.5, 225)), { size: 9.5 });
    doc.text(cols[1], y, fmtDays(x.worked), { size: 9.5, align: "right" });
    doc.text(cols[2], y, money(x.earned), { size: 9.5, align: "right" });
    doc.text(cols[3], y, x.advances ? "-" + money(x.advances) : "-", { size: 9.5, align: "right", gray: 0.45 });
    doc.text(cols[4], y, x.pending ? money(x.pending) : "al día", { size: 9.5, align: "right", bold: !!x.pending });
    y += 8; doc.line(M, y, 595 - M, y, { gray: 0.92 }); y += 14;
  }

  y += 2;
  doc.line(M, y - 10, 595 - M, y - 10, { width: 1, gray: 0.5 });
  doc.text(cols[0], y, `TOTAL (${r.rows.length})`, { size: 10, bold: true });
  doc.text(cols[1], y, fmtDays(r.totals.worked), { size: 10, bold: true, align: "right" });
  doc.text(cols[2], y, money(r.totals.earned), { size: 10, bold: true, align: "right" });
  doc.text(cols[3], y, r.totals.advances ? "-" + money(r.totals.advances) : "-", { size: 10, bold: true, align: "right" });
  doc.text(cols[4], y, money(r.totals.pending), { size: 10, bold: true, align: "right" });
  if (r.days.length <= 8) {          // solo tiene sentido en un rango semanal
    y += 20;
    doc.text(M, y, `Día de pago: ${FONT_OK(prettyDay(sabadoDe(r.from)))}`, { size: 8.5, gray: 0.45 });
  }
  pdfFooter(doc, pag);

  return { blob: doc.blob(), name: `reporte_${obra.replace(/[^\w]+/g, "-")}_${r.from}_${r.to}.pdf` };
}

// Detalle de un trabajador: lo que trabajo dia a dia y cuanto le toca.
function workerPdf(row, r, abonos = null) {
  const doc = new MiniPdf({ logo: logoParaPdf() });
  const obra = S.sites.find((x) => x.id === S.siteId)?.name || "Obra";
  let y = pdfHeader(doc, FONT_OK(row.fullName), `${FONT_OK(obra)} · del ${r.from} al ${r.to}`);
  let pag = 1;

  // Resumen arriba, que es lo que el trabajador quiere ver de un vistazo.
  doc.rect(M, y - 14, 595 - 2 * M, 52, 0.96);
  const cajas = [
    ["Días trabajados", fmtDays(row.worked)],
    ["Total ganado", money(row.earned)],
    ["Abonos", row.advances ? "-" + money(row.advances) : money(0)],
    ["A recibir", money(row.pending)],
  ];
  const anchoCaja = (595 - 2 * M) / cajas.length;
  cajas.forEach(([lbl, val], i) => {
    const cx = M + anchoCaja * i + anchoCaja / 2;
    doc.text(cx, y + 2, lbl.toUpperCase(), { size: 7, gray: 0.45, align: "center" });
    doc.text(cx, y + 22, FONT_OK(val), { size: 13, bold: i === 3, align: "center" });
  });
  y += 62;

  if (row.paid) {
    doc.text(M, y, `Ya pagado antes: ${money(row.paid)}`, { size: 8.5, gray: 0.45 });
    y += 16;
  }

  const ESTADO = { P: "Presente", M: "Medio día", A: "Falta" };
  const cols = [M, 330, 440, 595 - M];
  const head = () => {
    doc.text(cols[0], y, "FECHA", { size: 7.5, bold: true, gray: 0.45 });
    doc.text(cols[1], y, "ESTADO", { size: 7.5, bold: true, gray: 0.45, align: "right" });
    doc.text(cols[2], y, "MONTO", { size: 7.5, bold: true, gray: 0.45, align: "right" });
    doc.text(cols[3], y, "PAGADO", { size: 7.5, bold: true, gray: 0.45, align: "right" });
    y += 6; doc.line(M, y, 595 - M, y); y += 14;
  };
  head();

  // Solo los dias con marca: las filas vacias no aportan nada en papel.
  const dias = r.days.filter((d) => row.marks[d]);
  for (const d of dias) {
    if (y > 842 - 70) {
      pdfFooter(doc, pag++); doc.newPage();
      y = pdfHeader(doc, FONT_OK(row.fullName), `${FONT_OK(obra)} · del ${r.from} al ${r.to}`); head();
    }
    const m = row.marks[d];
    doc.text(cols[0], y, FONT_OK(prettyDay(d)), { size: 9.5 });
    doc.text(cols[1], y, ESTADO[m.s], { size: 9.5, align: "right", gray: 0.35 });
    doc.text(cols[2], y, money(m.amount), { size: 9.5, align: "right" });
    doc.text(cols[3], y, m.paid ? "Si" : "-", { size: 9.5, align: "right", gray: 0.45 });
    y += 8; doc.line(M, y, 595 - M, y, { gray: 0.92 }); y += 14;
  }
  if (!dias.length) doc.text(M, y, "Sin días marcados en este período.", { size: 9.5, gray: 0.5 });

  if (abonos && abonos.length) {
    y += 18;
    if (y > 842 - 90) { pdfFooter(doc, pag++); doc.newPage(); y = M + 40; }
    doc.text(M, y, "ABONOS ENTREGADOS", { size: 7.5, bold: true, gray: 0.45 });
    y += 6; doc.line(M, y, 595 - M, y); y += 14;
    for (const a of abonos) {
      doc.text(M, y, FONT_OK(a.day + (a.note ? " · " + a.note : "")), { size: 9.5 });
      doc.text(595 - M, y, "-" + money(a.amount), { size: 9.5, align: "right" });
      y += 8; doc.line(M, y, 595 - M, y, { gray: 0.92 }); y += 14;
    }
  }
  pdfFooter(doc, pag);

  const slug = row.fullName.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^\w]+/g, "-");
  return { blob: doc.blob(), name: `${slug}_${r.from}_${r.to}.pdf` };
}

/* ------------------------- descargar y compartir ------------------------- */
function download(blob, name) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

// Manda el PDF adjunto. OJO: WhatsApp DESCARTA el texto cuando recibe un
// archivo, asi que aqui NO se manda texto; para eso esta shareTexto(). Mezclar
// los dos hacia que siempre se perdiera uno.
async function sharePdf(blob, name) {
  const file = new File([blob], name, { type: "application/pdf" });
  if (!navigator.canShare?.({ files: [file] })) {
    // Sin soporte para adjuntar (tipico en computador): se descarga y se avisa.
    download(blob, name);
    toast("Tu equipo no puede adjuntar directo. Se descargó el PDF para que lo adjuntes.");
    return;
  }
  try {
    await navigator.share({ files: [file], title: name });
  } catch (err) {
    if (err?.name !== "AbortError") toast("No se pudo compartir el archivo.", "err");
  }
}

// El dia de pago es el SABADO. La semana de pago va de lunes a domingo para no
// dejar afuera ningun dia trabajado; el sabado es cuando se entrega la plata.
const PAYDAY = 6;                       // 0=domingo ... 6=sabado

const RANGES = [
  ["Semana de pago", () => weekRange(0)],
  ["Semana pasada", () => weekRange(-1)],
  ["Este mes", () => monthRange(0)],
  ["Mes pasado", () => monthRange(-1)],
];

// Sabado de la semana que cubre el rango elegido, para poder decir cuando se paga.
function sabadoDe(from) {
  const [y, m, d] = from.split("-").map(Number);
  const dt = new Date(y, m - 1, d);
  dt.setDate(dt.getDate() + ((PAYDAY - dt.getDay()) + 7) % 7);
  return ymd(dt);
}

// Semana de lunes a domingo (offset en semanas respecto de la actual).
function weekRange(off) {
  const d = hoyDate();
  d.setDate(d.getDate() + off * 7);
  const dow = (d.getDay() + 6) % 7;          // 0 = lunes
  const from = new Date(d); from.setDate(d.getDate() - dow);
  const to = new Date(from); to.setDate(from.getDate() + 6);
  return [ymd(from), ymd(to)];
}
function monthRange(off) {
  const d = hoyDate();
  const from = new Date(d.getFullYear(), d.getMonth() + off, 1);
  const to = new Date(d.getFullYear(), d.getMonth() + off + 1, 0);
  return [ymd(from), ymd(to)];
}

$("rangeChips").innerHTML = RANGES.map((r, i) =>
  `<button class="chip" data-range="${i}">${r[0]}</button>`).join("");
$("rangeChips").addEventListener("click", (e) => {
  const b = e.target.closest("[data-range]");
  if (!b) return;
  const [f, t] = RANGES[Number(b.dataset.range)][1]();
  $("repFrom").value = f; $("repTo").value = t;
  loadReport();
});
// El rango elegido se resalta; si se editan las fechas a mano, ninguno queda activo.
function markActiveRange() {
  const f = $("repFrom").value, t = $("repTo").value;
  $("rangeChips").querySelectorAll("[data-range]").forEach((b) => {
    const [rf, rt] = RANGES[Number(b.dataset.range)][1]();
    b.classList.toggle("on", rf === f && rt === t);
  });
}
$("repFrom").addEventListener("change", loadReport);
$("repTo").addEventListener("change", loadReport);

let lastReport = null;

async function loadReport() {
  if (!$("repFrom").value || !$("repTo").value) {
    // Por defecto, la semana que se paga este sabado: es lo que se mira a diario.
    const [f, t] = RANGES[0][1]();
    $("repFrom").value = f; $("repTo").value = t;
  }
  if (!S.siteId) { $("reportBox").innerHTML = `<div class="empty">No hay obras todavía.</div>`; return; }
  $("reportBox").innerHTML = `<div class="empty">Cargando…</div>`;
  try {
    const r = await api(`/api/report?siteId=${S.siteId}&from=${$("repFrom").value}&to=${$("repTo").value}`);
    lastReport = r;
    renderReport(r);
    markActiveRange();
  } catch (err) {
    $("reportBox").innerHTML = err.offline
      ? emptyState("offline", "El reporte necesita conexión.<br>Pasar lista sí funciona sin señal.")
      : emptyState("info", esc(err.message));
  }
}

$("repTabs").addEventListener("click", (e) => {
  const b = e.target.closest("[data-tab]");
  if (!b) return;
  S.repTab = b.dataset.tab;

});

      </div>
      ${row.pending < 0 ? `<p class="muted" style="margin:10px 0 0; text-align:center; color:var(--bad);">

                <div class="muted ellip">${esc(a.day)}${a.note ? " · " + esc(a.note) : ""}${a.byName ? " · " + esc(a.byName) : ""}</div>
              </div>
              ${admin && !a.settled ? `<button class="btn sm danger" data-adv="${a.id}">Quitar</button>` : ""}
            </div>`).join("")}
        </div>`;
      box.querySelectorAll("[data-adv]").forEach((b) => {
        b.addEventListener("click", async () => {
          if (!(await ask({ title: "¿Quitar este abono?", ok: "Quitar", cancel: "Cancelar", danger: true }))) return;
          try {
            await api(`/api/advances?id=${b.dataset.adv}`, { method: "DELETE" });
            toast("Abono quitado");
            closeModal();
            await loadReport();
            workerDetail(workerId);
          } catch (err) { toast(err.message, "err"); }
        });
      });
    } catch { /* sin conexion: el detalle se muestra igual sin los abonos */ }
  })();

  const pagar = async (deshacer) => {
    const q = `siteId=${S.siteId}&workerId=${workerId}&from=${lastReport.from}&to=${lastReport.to}`;
    try {
      const r = deshacer
        ? await api(`/api/payments?${q}`, { method: "DELETE" })
        : await api("/api/payments", { method: "POST", body: {
            siteId: S.siteId, workerId, from: lastReport.from, to: lastReport.to } });
      toast(deshacer
        ? (r.days ? `${plural(r.days, "día", "días")} sin pagar de nuevo` : "No había nada que deshacer")
        : (r.days || r.advances
            ? `Pagado: ${money(r.net)}${r.advances ? ` (${money(r.amount)} menos ${money(r.advances)} de abonos)` : ""}`
            : "No había nada que cambiar"));
      closeModal();
      await loadReport();
      workerDetail(workerId);          // se vuelve a abrir con los numeros nuevos
    } catch (err) { toast(err.message, "err"); }
  };

  const pb = $("payBtn");
  if (pb) pb.addEventListener("click", async () => {
    if (await ask({
      title: "¿Marcar como pagado?",
      text: [
        `${row.fullName}, del ${lastReport.from} al ${lastReport.to}.`,
        `Días trabajados: ${money(row.earned - row.paid)}.`,
        row.advances ? `Menos abonos ya entregados: ${money(row.advances)}.` : "",
        `Se le entrega en mano: ${money(row.pending)}.`,
        "El monto queda congelado: si después le subes el pago por día, esto no cambia.",
      ].filter(Boolean).join(" "),
      ok: "Marcar pagado", cancel: "Cancelar",
    })) pagar(false);
  });

  const ub = $("unpayBtn");
  if (ub) ub.addEventListener("click", async () => {
    if (await ask({
      title: "¿Deshacer el pago?",
      text: "Los días de este período vuelven a quedar como pendientes.",
      ok: "Deshacer", cancel: "Cancelar", danger: true,
    })) pagar(true);
  });
}

async function loadStaff() {

  try {
    const { workers } = await api(`/api/workers?siteId=${S.siteId}&all=1&today=${todayObra()}`);
    if (!workers.length) {
      $("staffList").innerHTML = emptyState("people", "Sin personal en esta obra.");

    }
    $("staffList").innerHTML = workers.map((w) => `
      <button class="list-item" data-w="${w.id}">
        <div class="grow">
          <div class="ellip"><b>${esc(w.fullName)}</b>${w.active ? "" : ' <span class="badge off">baja</span>'}</div>
          <div class="muted ellip">${esc(w.trade || "—")}${
            w.dailyRate != null ? " · " + money(w.dailyRate) + "/día" : " · sin pago por día"}${

/* ------------------------ pago por dia e historial -----------------------
   Cada monto rige DESDE una fecha. Asi se le puede subir el pago a alguien a
   partir del lunes sin tocar lo que ya trabajo: los dias viejos se siguen
   pagando al monto que regia ese dia.
-------------------------------------------------------------------------- */
async function ratesScreen(w) {
  const { rates } = await api(`/api/workers?id=${w.id}&rates=1`);
  const hoy = todayObra();
  const vigente = rates.find((r) => r.fromDay <= hoy);

  openModal(`
    <h2>Pago por día de ${esc(w.fullName)}</h2>
    <p class="muted" style="margin:-6px 0 14px;">
      ${vigente ? `Hoy gana <b>${money(vigente.amount)}</b> por día completo.` : "Todavía no tiene pago por día asignado."}
      Medio día paga la mitad.
    </p>

    <form id="rForm" class="card pad">
      <label class="field"><span>Nuevo pago por día (C$)</span>
        <input id="rAmount" type="number" min="0" step="any" inputmode="decimal" required
               value="${vigente ? vigente.amount : ""}">
      </label>
      <label class="field"><span>Rige desde</span>
        <input id="rFrom" type="date" value="${hoy}" required>
      </label>
      <p class="muted" style="margin:-6px 0 14px;">
        El primer monto que registres cubre también los días ya marcados antes de
        esa fecha. Pon una fecha futura para dejar programada una mejora: ahí sí,
        los días anteriores se siguen pagando al monto viejo.
      </p>
      <div id="rMsg"></div>
      <button class="btn primary wide" type="submit">Guardar</button>
    </form>

    <h3>Historial</h3>
    <div class="card">
      ${rates.length ? rates.map((r) => `
        <div class="list-item">
          <div class="grow">
            <div><b>${money(r.amount)}</b> ${r.fromDay > hoy ? '<span class="badge">programado</span>' : ""}</div>
            <div class="muted">desde ${esc(r.fromDay)}</div>
          </div>
          <button class="btn sm danger" data-rate="${r.id}">Quitar</button>
        </div>`).join("") : emptyState("info", "Sin montos cargados.")}
    </div>
  `);

  $("rForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    try {
      await api("/api/workers?rates=1", { method: "POST", body: {
        workerId: w.id, amount: Number($("rAmount").value), fromDay: $("rFrom").value,
      }});
      toast("Pago por día guardado");
      ratesScreen(w);
      loadStaff();
    } catch (err) { $("rMsg").innerHTML = `<div class="msg err">${esc(err.message)}</div>`; }
  });

  $("modalRoot").querySelectorAll("[data-rate]").forEach((b) => {
    b.addEventListener("click", async () => {
      if (!(await ask({
        title: "¿Quitar esta tarifa?",
        text: "Los días que cubría pasarán a pagarse con la tarifa anterior. Lo ya pagado no cambia.",
        ok: "Quitar", cancel: "Cancelar", danger: true,
      }))) return;
      try {
        await api(`/api/workers?rate=${b.dataset.rate}`, { method: "DELETE" });
        toast("Tarifa quitada");
        ratesScreen(w);
        loadStaff();
      } catch (err) { toast(err.message, "err"); }
    });
  });
}

/* ---------------------------- nombre y logo ------------------------------
   El logo se achica en el navegador antes de subirlo: lo que llega al servidor
   son unos pocos KB, no la foto de 4 MB que salio del telefono.
-------------------------------------------------------------------------- */
function brandScreen() {
  let logo = S.account?.logo || null;      // null = sin logo; se aplica al guardar

  const pintar = () => {
    const box = $("bPreview");
    box.innerHTML = logo
      ? `<img class="brand-lg" src="${esc(logo)}" alt="">`
      : `<div class="brand-lg brand-ph">${icon("building")}</div>`;
    $("bRemove").classList.toggle("hidden", !logo);
  };

  openModal(`
    <h2>Nombre y logo</h2>
    <form id="bForm" class="card pad">
      <div class="row" style="margin-bottom:16px;">
        <div id="bPreview"></div>
        <div class="grow">
          <label class="btn sm wide" for="bFile" style="cursor:pointer;">
            ${icon("image")}Elegir imagen
            <input type="file" id="bFile" accept="image/*" class="vhidden">
          </label>
          <button type="button" class="btn sm wide danger hidden" id="bRemove" style="margin-top:6px;">Quitar logo</button>
        </div>
      </div>

      <label class="field"><span>Nombre de la empresa</span>
        <input id="bName" value="${esc(S.account?.name || "")}" maxlength="80" required>
      </label>
      <p class="muted" style="margin:-6px 0 14px;">
        El logo aparece arriba en la app y en los PDF que envíes.
      </p>
      <div id="bMsg"></div>
      <button class="btn primary wide" type="submit">Guardar</button>
    </form>
  `);
  pintar();

  $("bFile").addEventListener("change", async (e) => {
    const f = e.target.files?.[0];
    if (!f) return;
    $("bMsg").innerHTML = `<div class="msg">Procesando la imagen…</div>`;
    try {
      logo = await fileToLogo(f);
      pintar();
      $("bMsg").innerHTML = "";
    } catch (err) {
      $("bMsg").innerHTML = `<div class="msg err">${esc(err.message)}</div>`;
    }
    e.target.value = "";                   // permite volver a elegir el mismo archivo
  });
  $("bRemove").addEventListener("click", () => { logo = null; pintar(); });

  $("bForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('button[type="submit"]');
    btn.disabled = true;
    try {
      const r = await api("/api/auth?account=1", { method: "PUT", body: {
        name: $("bName").value, logo,
      }});
      S.account = r.account;
      localStorage.setItem("ao_account", JSON.stringify(S.account));
      paintBrand();
      closeModal();
      toast("Guardado");
      renderSettings();
    } catch (err) {
      $("bMsg").innerHTML = `<div class="msg err">${esc(err.message)}</div>`;
    } finally { btn.disabled = false; }
  });
}
