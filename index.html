      if (isNew && r.site) { S.siteId = r.site.id; localStorage.setItem("ao_site", S.siteId); await loadSites(); }
      closeModal(); toast(isNew ? "Obra creada" : "Guardado"); setView(S.view);
    } catch (err) { $("sMsg").innerHTML = `<div class="msg err">${esc(err.message)}</div>`; }
  });
  if (!isNew && s.active) $("sPick").addEventListener("click", () => pickSite(s));
}

function pickSite(s) {
  S.siteId = s.id;
  localStorage.setItem("ao_site", S.siteId);
  $("siteName").textContent = s.name;
  S.dirty.clear();
  closeModal();
  setView("list");
}

// Selector rapido de obra desde la barra superior.
$("siteBtn").addEventListener("click", async () => {
  const active = S.sites.filter((s) => s.active !== 0);
  if (!active.length) return sitesScreen();
  openModal(`
    <h2>Cambiar de obra</h2>
    <div class="card">
      ${active.map((s) => `
        <button class="list-item" data-p="${s.id}">
          <div class="grow">
            <div class="ellip"><b>${esc(s.name)}</b></div>
            <div class="muted">${s.workers} trabajador${s.workers === 1 ? "" : "es"}</div>
          </div>
          ${s.id === S.siteId ? '<span class="badge admin">actual</span>' : ""}
        </button>`).join("")}
    </div>
    <button class="btn wide" id="manageSites" style="margin-top:12px;">Administrar obras</button>
  `);
  $("modalRoot").querySelectorAll("[data-p]").forEach((b) => {
    b.addEventListener("click", () => pickSite(active.find((s) => s.id === Number(b.dataset.p))));
  });
  $("manageSites").addEventListener("click", sitesScreen);
});

/* ------------------------------ usuarios -------------------------------- */
async function usersScreen() {
  const { users } = await api("/api/auth");
  openModal(`
    <h2>Usuarios del sistema</h2>
    <p class="muted" style="margin:-6px 0 12px;">Quienes entran a la app. Los albañiles no necesitan usuario.</p>
    <div class="card">
      ${users.map((u) => `
        <button class="list-item" data-u="${u.id}">
          <div class="grow">
            <div class="ellip"><b>${esc(u.name)}</b>${u.active ? "" : ' <span class="badge off">inactivo</span>'}</div>
            <div class="muted ellip">${esc(u.fullName || "—")}${
              u.role === "admin" ? " · todas las obras"
              : " · " + plural((u.siteIds || []).length, "obra", "obras")}</div>
          </div>
          <span class="badge ${u.role === "admin" ? "admin" : ""}">${u.role === "admin" ? "Admin" : "Capataz"}</span>
        </button>`).join("")}
    </div>
    <button class="btn primary wide" id="addUser" style="margin-top:12px;">${icon("userPlus")}Nuevo usuario</button>
  `);
  $("modalRoot").querySelectorAll("[data-u]").forEach((b) => {
    b.addEventListener("click", () => userForm(users.find((u) => u.id === Number(b.dataset.u))));
  });
  $("addUser").addEventListener("click", () => userForm(null));
}

function userForm(u) {
  const isNew = !u;
  openModal(`
    <h2>${isNew ? "Nuevo usuario" : esc(u.name)}</h2>
    <form id="uForm" class="card pad">
      ${isNew ? `<label class="field"><span>Usuario * (sin espacios)</span>
        <input id="uName" required maxlength="20" autocapitalize="none" spellcheck="false"></label>` : ""}
      <label class="field"><span>Nombre completo</span><input id="uFull" value="${esc(u?.fullName || "")}" maxlength="80"></label>
      <label class="field"><span>Rol</span>
        <select id="uRole">
          <option value="foreman" ${u?.role !== "admin" ? "selected" : ""}>Capataz — solo las obras que le asignes</option>
          <option value="admin" ${u?.role === "admin" ? "selected" : ""}>Administrador — todas las obras de la empresa</option>
        </select>
      </label>
      <div class="field" id="uSitesBox">
        <span>Obras que puede ver</span>
        <div class="card">
          ${S.sites.length ? S.sites.map((st) => `
            <label class="list-item" style="cursor:pointer;">
              <input type="checkbox" class="uSite" value="${st.id}" style="width:20px; height:20px;"
                     ${(u?.siteIds || []).includes(st.id) ? "checked" : ""}>
              <span class="grow ellip">${esc(st.name)}</span>
            </label>`).join("") : emptyState("building", "Primero crea una obra.")}
        </div>
        <p class="muted" style="margin:6px 0 0;">Sin ninguna marcada, el capataz no verá nada.</p>
      </div>
      <label class="field"><span>${isNew ? "Contraseña * (mínimo 6)" : "Nueva contraseña (dejar vacío para no cambiar)"}</span>
        <input id="uPw" type="password" ${isNew ? "required" : ""} minlength="6" maxlength="64" autocomplete="new-password"></label>
      ${isNew ? "" : `
        <label class="row" style="margin-bottom:12px; gap:8px;">
          <input type="checkbox" id="uActive" ${u.active ? "checked" : ""} style="width:20px; height:20px;">
          <span>Usuario activo</span>
        </label>`}
      <div id="uMsg"></div>
      <button class="btn primary wide" type="submit">${isNew ? "Crear" : "Guardar"}</button>
    </form>
  `);
  // El admin ve todas las obras de su empresa: la asignacion solo aplica al capataz.
  const syncSitesBox = () => $("uSitesBox").classList.toggle("hidden", $("uRole").value === "admin");
  $("uRole").addEventListener("change", syncSitesBox);
  syncSitesBox();

  $("uForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const siteIds = [...$("uSitesBox").querySelectorAll(".uSite:checked")].map((c) => Number(c.value));
    try {
      if (isNew) {
        await api("/api/auth?new=1", { method: "POST", body: {
          name: $("uName").value.trim(), password: $("uPw").value,
          fullName: $("uFull").value, role: $("uRole").value, siteIds,
        }});
      } else {
        const body = { fullName: $("uFull").value, role: $("uRole").value, active: $("uActive").checked, siteIds };
        if ($("uPw").value) body.password = $("uPw").value;
        await api(`/api/auth?id=${u.id}`, { method: "PUT", body });
      }
      closeModal(); toast("Guardado"); usersScreen();
    } catch (err) { $("uMsg").innerHTML = `<div class="msg err">${esc(err.message)}</div>`; }
  });
}

/* --------------------------- mi contraseña ------------------------------ */
function passwordScreen() {
  openModal(`
    <h2>Cambiar mi contraseña</h2>
    <form id="pForm" class="card pad">
      <label class="field"><span>Contraseña actual</span><input id="pOld" type="password" required autocomplete="current-password"></label>
      <label class="field"><span>Nueva contraseña (mínimo 6)</span><input id="pNew" type="password" required minlength="6" maxlength="64" autocomplete="new-password"></label>
      <div id="pMsg"></div>
      <button class="btn primary wide" type="submit">Cambiar</button>
    </form>`);
  $("pForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    try {
      const r = await api("/api/auth", { method: "PUT", body: {
        currentPassword: $("pOld").value, password: $("pNew").value,
      }});
      if (r.token) { S.token = r.token; localStorage.setItem("ao_token", r.token); }
      closeModal(); toast("Contraseña cambiada");
    } catch (err) { $("pMsg").innerHTML = `<div class="msg err">${esc(err.message)}</div>`; }
  });
}

$("meBtn").addEventListener("click", () => setView("settings"));

/* ===========================================================================
   Modal
   =========================================================================== */
function openModal(html) {
  $("modalRoot").innerHTML = `
    <div class="modal">
      <div class="sheet">
        <button class="btn sm" id="modalClose" style="float:right; margin-left:10px;">Cerrar</button>
        ${html}
      </div>
    </div>`;
  $("modalClose").addEventListener("click", closeModal);
  $("modalRoot").querySelector(".modal").addEventListener("click", (e) => {
    if (e.target.classList.contains("modal")) closeModal();
  });
}
function closeModal() { $("modalRoot").innerHTML = ""; }

/* ===========================================================================
   Inicio
   =========================================================================== */
window.addEventListener("beforeunload", (e) => {
  if (S.dirty.size) { e.preventDefault(); e.returnValue = ""; }
});

// Iconos que viven en el HTML estatico (se pintan una vez, al arrancar).
applyTheme(currentTheme());
document.querySelectorAll("nav.bottom button").forEach((b) =>
  b.insertAdjacentHTML("afterbegin", icon(b.dataset.icon)));
$("dayPrev").innerHTML = icon("left");
$("dayNext").innerHTML = icon("right");
$("siteChev").innerHTML = icon("down");
$("loginMark").innerHTML = icon("helmet");
$("addWorker").innerHTML = icon("plus") + "Agregar";
$("pdfBtn").innerHTML = icon("download") + "Descargar PDF";
// El boton de cuenta muestra las iniciales del usuario (se completa al entrar).
$("meBtn").textContent = "…";

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/sw.js").catch(() => {});
}

(async () => {
  renderSyncBar();
  if (!S.token) return;
  try {
    const { me, account } = await api("/api/auth");
    S.me = me; S.account = account || null;
    localStorage.setItem("ao_me", JSON.stringify(me));
    localStorage.setItem("ao_account", JSON.stringify(S.account));
    await start();
    syncQueue();                 // por si quedo algo de la ultima vez
  } catch (err) {
    // Sin red se entra con la sesion guardada: la app tiene que servir en obra
    // aunque no haya señal. El token se revalida en la primera llamada con red.
    if (err.offline && S.me) { await start(); return; }
    logout();
  }
})();
</script>
</body>
</html>
